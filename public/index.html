<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BimaSetu CRM — a clickable prototype of the BimaKavach sales and relationship-management interface. Every record in it is synthetic.">
<meta name="robots" content="noindex, nofollow">
<title>BimaSetu CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* ---- BimaEndorse / BimaOps design kit tokens, verbatim ---- */
:root{
  --shell:#EEF0F4; --page:#FFFFFF; --bar:#F6F7F9; --card:#FFFFFF; --cardAlt:#FAFAFC;
  --border:#E8EAF0; --borderStrong:#D6DAE4;
  --ink:#171630; --ink2:#5A5A72; --ink3:#9A9AB0;
  --violet:#4318D4; --violetDeep:#2E0FA0; --violetSoft:#EFEAFD; --violetLine:#D9CEFA;
  --orange:#F97316;
  --red:#D92D20; --redSoft:#FEF0EF; --redLine:#FBD9D5;
  --amber:#B54708; --amberSoft:#FEF6E7; --amberLine:#F7E3BE;
  --green:#0B7A48; --greenSoft:#E9F7EF; --greenLine:#BDE6CE;
  --blue:#175CD3; --blueSoft:#EBF2FE; --blueLine:#CADDFA;
  --grey:#5A5A72; --greySoft:#F2F3F7; --greyLine:#E3E5EC;
  --font:"Outfit",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* ---- type scale: one global standard, 16px base ---- */
  --fs-3xs:11px;   /* tags on a chip */
  --fs-2xs:13px;   /* labels, hints, field errors */
  --fs-xs:14px;    /* meta lines, chips, secondary text */
  --fs-base:16px;  /* body, tables, inputs, buttons */
  --fs-md:17px;    /* emphasised body, card titles */
  --fs-lg:18px;    /* nav, section titles */
  --fs-xl:20px;    /* h3 */
  --fs-2xl:22px;   /* h2 small */
  --fs-3xl:25px;   /* wordmark, h2 */
  --fs-4xl:32px;   /* h1 */
  --fs-5xl:34px;
  --fs-timer:46px; /* the call timer */
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shell);color:var(--ink);font:400 var(--fs-base)/1.55 var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
input,select,textarea{font:inherit;font-family:var(--font)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--borderStrong);border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{margin:0;text-wrap:balance}
a{color:var(--violet)}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* ---- shell ---- */
.app{display:flex;min-height:100%}
.side{flex:0 0 248px;display:flex;flex-direction:column;padding:20px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh}
.wm{font-size:var(--fs-3xl);font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.wm i{font-style:normal;color:var(--orange)}
.wmsub{font-size:var(--fs-xs);color:var(--ink3);margin-top:1px}
/* ---- view switcher: a head works either their own book or the team's [stated 23 Sep] ---- */
.vsw{margin-top:14px;display:flex;gap:3px;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--border)}
.vsw button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:9px;padding:7px 4px;font-size:var(--fs-xs);font-weight:600;color:var(--ink3);white-space:nowrap}
.vsw button svg{opacity:.7}
.vsw button.on{background:var(--ink);color:var(--page)}
.vsw button.on svg{opacity:1}
.vsw button:not(.on):hover{color:var(--ink2);background:var(--cardAlt)}
.ssearch{margin-top:16px;display:flex;align-items:center;gap:8px;border-radius:12px;padding:9px 12px;background:var(--card);border:1px solid var(--border);cursor:text}
.ssearch input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:var(--fs-base);color:var(--ink)}
.ssearch input::placeholder{color:var(--ink3)}
.menu-l{margin:20px 8px 0;font-size:var(--fs-xs);color:var(--ink3);font-weight:500}
.nav{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border-radius:12px;padding:11px 12px;color:var(--ink2);font-size:var(--fs-md);font-weight:600;text-align:left;width:100%;position:relative}
.nav button.on{background:var(--greySoft);color:var(--ink);font-weight:700}
.nav button:disabled{color:var(--borderStrong)}
.nav .dot{position:absolute;left:26px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.nav .cnt{margin-left:auto;font-size:var(--fs-2xs);color:var(--ink3);font-weight:500}
.persona{margin-top:auto;border-radius:16px;padding:14px;background:var(--card);border:1px solid var(--border)}
.persona .row{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--orange);color:#fff;font-size:var(--fs-md);font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.avatar.sm{width:22px;height:22px;font-size:var(--fs-3xs)}
.persona .nm{font-size:var(--fs-lg);font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px}
.persona .nm i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.persona .rl{font-size:var(--fs-xs);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.persona .sw{width:100%;margin-top:12px;border-radius:12px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--violetSoft);border:1px solid var(--violetLine);color:var(--violetDeep);font-size:var(--fs-base);font-weight:600}
.persona .more{display:flex;gap:8px;margin-top:8px}
.persona .more button{flex:1;border-radius:10px;padding:7px 8px;font-size:var(--fs-2xs);font-weight:600;color:var(--ink2);border:1px solid var(--border);background:var(--card)}
.main{flex:1;min-width:0;padding:12px 12px 12px 0;display:flex;flex-direction:column}
.panel{flex:1;border-radius:16px;background:var(--page);border:1px solid var(--border);overflow:hidden;overflow:clip;display:flex;flex-direction:column;min-height:calc(100dvh - 24px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 24px;background:var(--bar);border-bottom:1px solid var(--border)}
.topbar .sc{font-size:var(--fs-base);letter-spacing:.6px;font-weight:600;color:var(--ink);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .rt{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.topbar .ctx{font-size:var(--fs-xs);color:var(--ink2);font-weight:600}
.content{padding:24px 32px 40px;flex:1}
.burger{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;z-index:40;background:var(--shell);transform:translateX(-100%);transition:transform .15s;width:248px;height:100dvh;box-shadow:0 0 0 100vw rgba(23,22,48,0)}
  .side.open{transform:none;box-shadow:0 0 0 100vw rgba(23,22,48,.35)}
  .main{padding:12px}
  .content{padding:18px 16px 32px}
  .burger{display:inline-flex}
}

/* ---- type ---- */
.h1{font-size:var(--fs-4xl);font-weight:700;color:var(--violet);letter-spacing:-.4px;line-height:1.15}
.h2{font-size:var(--fs-3xl);font-weight:700;color:var(--violet);letter-spacing:-.3px}
.h3{font-size:var(--fs-xl);font-weight:650;color:var(--ink)}
.h4{font-size:var(--fs-lg);font-weight:650;color:var(--ink)}
.body{font-size:var(--fs-base);color:var(--ink2);line-height:1.5}
.meta{font-size:var(--fs-xs);color:var(--ink3)}
.lbl{font-size:var(--fs-2xs);color:var(--ink3);font-weight:500}
.sub{font-size:var(--fs-md);color:var(--ink3);margin-top:4px;max-width:680px;line-height:1.5}
.diamonds{height:12px;margin:10px 0 14px;background-image:radial-gradient(var(--violet) 1.6px,transparent 1.7px);background-size:22px 12px;background-position:0 5px;opacity:.65}
.diamonds.grey{background-image:radial-gradient(var(--borderStrong) 1.6px,transparent 1.7px)}

/* ---- primitives ---- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid var(--greyLine);background:var(--greySoft);color:var(--grey);padding:4px 10px;font-size:var(--fs-xs);font-weight:500;white-space:nowrap;vertical-align:middle}
.chip.sm{padding:2px 8px;font-size:var(--fs-2xs)}
.chip .d{width:5px;height:5px;border-radius:50%;background:currentColor}
.chip.violet{color:var(--violetDeep);background:var(--violetSoft);border-color:var(--violetLine)}
.chip.red{color:var(--red);background:var(--redSoft);border-color:var(--redLine)}
.chip.amber{color:var(--amber);background:var(--amberSoft);border-color:var(--amberLine)}
.chip.green{color:var(--green);background:var(--greenSoft);border-color:var(--greenLine)}
.chip.blue{color:var(--blue);background:var(--blueSoft);border-color:var(--blueLine)}
.pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 16px;border:1px solid var(--borderStrong);background:var(--card);color:var(--ink2);font-size:var(--fs-base);font-weight:500}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--ink3)}
.pill.on{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
.pill.on .d{background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--borderStrong);background:var(--card);color:var(--ink);padding:8px 16px;font-size:var(--fs-base);font-weight:600;white-space:nowrap;transition:background .1s,border-color .1s}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{background:var(--violetDeep);border-color:var(--violetDeep)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--greySoft);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--redLine)}
.btn.danger:hover{background:var(--redSoft)}
.btn.outline{color:var(--violet);border-color:var(--violet)}
.btn.sm{padding:6px 12px;font-size:var(--fs-xs)}
.btn.lg{padding:10px 20px}
.btn.full{width:100%}
.btn:disabled{background:var(--greySoft);color:var(--ink3);border-color:var(--greyLine)}
.btn svg{width:15px;height:15px;flex:0 0 auto}
.btn.sm svg{width:13px;height:13px}
.card{border-radius:16px;border:1px solid var(--border);background:var(--card)}
.card.pad{padding:16px}
.card.alt{background:var(--cardAlt)}
.cardh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border)}
.cardh .t{font-size:var(--fs-lg);font-weight:650;color:var(--ink)}
.cardh .s{font-size:var(--fs-xs);color:var(--ink3)}
.cardh .sp{flex:1}
.cardb{padding:16px}
.kv .lbl{margin-bottom:2px}
.kv .v{font-size:var(--fs-base);color:var(--ink);font-weight:500;line-height:1.4;word-break:break-word}
.kvgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 24px}
.kvgrid.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.kvgrid,.kvgrid.two{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.kvgrid,.kvgrid.two{grid-template-columns:1fr}}
.field{display:block}
.field .lbl{margin-bottom:4px}
.field .hint{margin-top:4px;font-size:var(--fs-2xs);color:var(--ink3);line-height:1.4}
.field .err{margin-top:4px;font-size:var(--fs-2xs);color:var(--red)}
.inp,.sel,textarea.inp{width:100%;border-radius:12px;border:1px solid var(--borderStrong);padding:8px 12px;font-size:var(--fs-base);color:var(--ink);background:var(--card);outline:0}
.inp:focus,.sel:focus,textarea.inp:focus{border-color:var(--violet);outline:2px solid var(--violet);outline-offset:-1px}
.inp.bad{border-color:var(--red)}
.inp:disabled,.sel:disabled{background:var(--greySoft);color:var(--ink2)}
textarea.inp{resize:vertical;min-height:64px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid.three{grid-template-columns:1fr 1fr 1fr}
@media (max-width:620px){.fgrid,.fgrid.three{grid-template-columns:1fr}}
.seg{display:inline-flex;border-radius:12px;border:1px solid var(--borderStrong);overflow:hidden}
.seg button{padding:7px 14px;font-size:var(--fs-base);font-weight:500;color:var(--ink2);background:var(--card)}
.seg button+button{border-left:1px solid var(--borderStrong)}
.seg button.on{background:var(--violet);color:#fff;font-weight:600}
.note{border-radius:16px;padding:12px 16px;font-size:var(--fs-xs);line-height:1.5;color:var(--ink2)}
.note .nt{display:flex;align-items:center;gap:8px;font-size:var(--fs-2xs);font-weight:650;margin-bottom:6px}
.note .nt svg{width:13px;height:13px}
.note.violet{background:var(--violetSoft);border:1px solid var(--violetLine)}.note.violet .nt{color:var(--violetDeep)}
.note.blue{background:var(--blueSoft);border:1px solid var(--blueLine)}.note.blue .nt{color:var(--blue)}
.note.amber{background:var(--amberSoft);border:1px solid var(--amberLine)}.note.amber .nt{color:var(--amber)}
.note.green{background:var(--greenSoft);border:1px solid var(--greenLine)}.note.green .nt{color:var(--green)}
.note.red{background:var(--redSoft);border:1px solid var(--redLine)}.note.red .nt{color:var(--red)}
.note.neutral{background:var(--greySoft);border:1px solid var(--greyLine)}.note.neutral .nt{color:var(--ink3)}
/* ---- click to call [stated 23 Sep] ---- */
.ctc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:4px 0 2px}
.ctcwho{display:flex;align-items:center;gap:12px;text-align:left}
.ctcwho .n{font-size:var(--fs-xl);font-weight:600;color:var(--ink)}
.ctcwho .m{font-size:var(--fs-base);color:var(--ink2)}
.ctcst{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-base);font-weight:600;color:var(--ink2);padding:5px 12px;border-radius:999px;background:var(--greySoft);border:1px solid var(--greyLine)}
.ctcst.amber{color:var(--amber);background:var(--amberSoft);border-color:var(--amberLine)}
.ctcst.green{color:var(--green);background:var(--greenSoft);border-color:var(--greenLine)}
.ctcst .dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}
.ctcst .dot.pulse{animation:ctcp 1.1s ease-in-out infinite}
@keyframes ctcp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
@media (prefers-reduced-motion:reduce){.ctcst .dot.pulse{animation:none}}
.ctcT{font-size:var(--fs-timer);font-weight:600;letter-spacing:-1px;color:var(--ink);line-height:1.1}
.ctcT.dim{color:var(--ink3)}
.ctcact{width:100%;display:flex;justify-content:center}
.ctcact .btn{min-width:200px;justify-content:center}
.ctcnote{font-size:var(--fs-xs);color:var(--ink3);max-width:420px;line-height:1.55}
.ctc .sim{width:100%;text-align:left}
.ctcbar{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:12px;margin-bottom:14px;background:var(--amberSoft);border:1px solid var(--amberLine);color:var(--amber)}
.ctcbar.green{background:var(--greenSoft);border-color:var(--greenLine);color:var(--green)}
.ctcbar svg{flex:0 0 auto;margin-top:1px}
.ctcbar b{display:block;font-size:var(--fs-base);font-weight:600}
.ctcbar span{display:block;font-size:var(--fs-xs);color:var(--ink2);margin-top:1px}
.sim{border-radius:16px;padding:12px 16px;background:var(--amberSoft);border:1px dashed var(--amberLine)}
.sim .st{display:flex;align-items:center;gap:8px;font-size:var(--fs-2xs);font-weight:650;color:var(--amber);margin-bottom:6px}
.sim .st .tag{border-radius:999px;padding:2px 8px;font-size:var(--fs-3xs);background:var(--card);color:var(--amber);border:1px solid var(--amberLine)}
.sim .sn{font-size:var(--fs-2xs);color:var(--amber);line-height:1.45;margin-bottom:8px}
.sim .sb{display:flex;flex-wrap:wrap;gap:8px}
.simbtn{border-radius:12px;padding:6px 12px;background:var(--card);border:1px dashed var(--amberLine);color:var(--amber);font-size:var(--fs-xs);font-weight:550}
.timeb{border-radius:16px;padding:12px 16px;background:var(--greySoft);border:1px dotted var(--borderStrong)}
.timeb .st{display:flex;align-items:center;gap:8px;font-size:var(--fs-2xs);font-weight:650;color:var(--ink3);margin-bottom:6px}
.timeb .sn{font-size:var(--fs-2xs);color:var(--ink3);line-height:1.45;margin-bottom:8px}
.timeb .sb{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.timebtn{border-radius:12px;padding:6px 12px;background:var(--card);border:1px dotted var(--borderStrong);color:var(--ink2);font-size:var(--fs-xs);font-weight:500}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 16px;text-align:center}
.empty .ic{border-radius:16px;border:1px solid var(--border);background:var(--cardAlt);padding:12px;margin-bottom:12px;color:var(--ink3)}
.empty .ic svg{width:19px;height:19px}
.empty .t{font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.empty .b{margin-top:4px;max-width:380px;font-size:var(--fs-base);color:var(--ink3);line-height:1.5}
.empty .a{margin-top:14px}
.fold{border-radius:16px;border:1px solid var(--border);background:var(--card)}
.fold>button{width:100%;display:flex;align-items:center;gap:10px;padding:14px 16px;text-align:left}
.fold>button svg.ic{width:16px;height:16px;color:var(--violet)}
.fold>button .t{font-size:var(--fs-md);font-weight:600;color:var(--ink)}
.fold>button .s{font-size:var(--fs-xs);color:var(--ink3)}
.fold>button .cv{margin-left:auto;color:var(--ink3);width:17px;height:17px;transition:transform .15s}
.fold.open>button .cv{transform:rotate(180deg)}
.fold .fb{display:none;padding:14px 16px 16px;border-top:1px solid var(--border)}
.fold.open .fb{display:block}

/* ---- table ---- */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t .chip{font-size:var(--fs-xs)}
table.t .sub{font-size:var(--fs-xs)}
table.t th{text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bar);font-size:var(--fs-base);font-weight:600;color:var(--ink);white-space:nowrap}
table.t th .f{display:inline-flex;align-items:center;gap:6px}
table.t th .f svg{width:14px;height:14px;color:var(--ink3)}
table.t td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:var(--fs-base);color:var(--ink2);vertical-align:middle}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:var(--cardAlt)}
table.t tr:last-child td{border-bottom:0}
table.t td.id{color:var(--violet);font-weight:600;font-size:var(--fs-base);white-space:nowrap}
table.t td.nm{color:var(--ink);font-weight:500;font-size:var(--fs-base)}
table.t td.num{text-align:right;white-space:nowrap}
table.t td .sub{font-size:var(--fs-2xs);color:var(--ink3);margin-top:2px;max-width:none}
table.t tr.dim td{opacity:.55}

/* ---- desk tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tiles.five{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1100px){.tiles,.tiles.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.tiles{grid-template-columns:1fr}}
.tile{border-radius:16px;border:1px solid var(--border);padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-height:104px;transition:border-color .1s}
.tile:hover{border-color:var(--borderStrong)}
.tile .n{font-size:var(--fs-xl);font-weight:650;color:var(--ink)}
.tile .n b{font-size:var(--fs-4xl);font-weight:700;margin-right:6px}
.tile .r{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:12px}
.tile .go{width:34px;height:30px;border-radius:12px;background:var(--card);border:1px solid var(--borderStrong);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile .go svg{width:15px;height:15px}
.tile.red{background:linear-gradient(135deg,#FEF1F0 0%,#FFFFFF 70%)}
.tile.amber{background:linear-gradient(135deg,#FEF7EA 0%,#FFFFFF 70%)}
.tile.violet{background:linear-gradient(135deg,#F1EDFD 0%,#FFFFFF 70%)}
.tile.blue{background:linear-gradient(135deg,#ECF3FE 0%,#FFFFFF 70%)}

.rowlist>div{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}

.banner.amber{background:var(--amberSoft);border:1px solid var(--amberLine);color:var(--amber)}
.banner.green{background:var(--greenSoft);border:1px solid var(--greenLine);color:var(--green)}

.stagebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}

.crumbs{display:flex;align-items:center;gap:6px;font-size:var(--fs-xs);color:var(--ink3);flex-wrap:wrap;margin-bottom:10px}

.link{color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:2px}

var DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MONN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function sameDay(a,b){ a=new Date(a); b=new Date(b); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function fmtD(t){ var d=new Date(t); return d.getDate()+' '+MONN[d.getMonth()]+' '+d.getFullYear(); }
function fmtDs(t){ var d=new Date(t); return d.getDate()+' '+MONN[d.getMonth()]; }
function fmtT(t){ var d=new Date(t); return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes(); }
function fmt(t){ var d=new Date(t), n=NOW(), y=new Date(n.getTime()-86400000), tm=new Date(n.getTime()+86400000);
  if(sameDay(d,n)) return 'today, '+fmtT(t); if(sameDay(d,y)) return 'yesterday, '+fmtT(t); if(sameDay(d,tm)) return 'tomorrow, '+fmtT(t);
  return DAYN[d.getDay()]+' '+d.getDate()+' '+MONN[d.getMonth()]+', '+fmtT(t); }
function daysBetween(a,b){ return Math.floor((b-a)/86400000); }
function daysAgo(t){ return daysBetween(t,S.now); }
function agoTx(t){ var d=daysAgo(t); if(d<=0){ var h=Math.floor((S.now-t)/3600000); return h<=0?'just now':h+' h ago'; } return d===1?'1 day ago':d+' days ago'; }

/* working calendar: Mon–Fri 10:00–19:00, company holidays out */
var WH={start:10,end:19};
var HOL=['2026-10-02','2026-10-20','2026-10-21','2026-11-09','2026-12-25'];
function ymd(d){ d=new Date(d); var m=d.getMonth()+1,q=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(q<10?'0':'')+q; }
function dtLocal(t){ var d=new Date(t), p=function(n){return (n<10?'0':'')+n;}; return ymd(d)+'T'+p(d.getHours())+':'+p(d.getMinutes()); }   /* for <input type="datetime-local"> */
function isWorkDay(d){ d=new Date(d); var g=d.getDay(); if(g===0||g===6) return false; return HOL.indexOf(ymd(d))<0; }
function atH(d,h){ var y=new Date(d); y.setHours(h,0,0,0); return y; }
function addWork(start,mins){
  var d=new Date(start), guard=0;
  while(mins>0 && guard++<5000){
    if(!isWorkDay(d)){ d.setDate(d.getDate()+1); d=atH(d,WH.start); continue; }
    if(d<atH(d,WH.start)) d=atH(d,WH.start);
    if(d>=atH(d,WH.end)){ d.setDate(d.getDate()+1); d=atH(d,WH.start); continue; }
    var avail=(atH(d,WH.end)-d)/60000;
    if(avail>=mins){ d=new Date(d.getTime()+mins*60000); mins=0; }
    else { mins-=avail; d.setDate(d.getDate()+1); d=atH(d,WH.start); }
  }
  return d.getTime();
}
function workMins(a,b){ /* working minutes from a to b */
  if(b<=a) return 0; var d=new Date(a), tot=0, guard=0;
  while(d.getTime()<b && guard++<5000){
    var s=atH(d,WH.start), e=atH(d,WH.end);
    if(isWorkDay(d)){ var from=Math.max(d.getTime(),s.getTime()), to=Math.min(b,e.getTime()); if(to>from) tot+=(to-from)/60000; }
    d.setDate(d.getDate()+1); d=atH(d,0);
  }
  return Math.round(tot);
}
function whTx(mins){ var h=Math.round(mins/60); if(h<1) return mins+' working min'; if(h<9) return h+' working h'; var d=(h/9); return (Math.round(d*10)/10)+' working d'; }
function workDate(t){ var d=new Date(t); if(!isWorkDay(d) || d>=atH(d,WH.end)){ do{ d.setDate(d.getDate()+1); }while(!isWorkDay(d)); return atH(d,WH.start).getTime(); } return t; }
function durMins(n,u){ return u==='h' ? n*60 : n*(WH.end-WH.start)*60; }
function durTx(n,u){ return n+' working '+(u==='h'?(n==1?'hour':'hours'):(n==1?'day':'days')); }

/* ---------- writes, and the offline simulation ---------- */
function write(fn,label){
  if(S.offline){ S.pending={fn:fn,label:label||'that change',sel:JSON.parse(JSON.stringify(S.sel||{})),route:S.route}; toast('Couldn’t save','You’re offline. Nothing was changed. Reconnect and retry '+(label||'it')+'.',{red:1,act:'Retry',on:'retry'}); return false; }
  fn(); save(); return true;

function retry(){ if(S.offline){ toast('Still offline','Reconnect from the sidebar first.',{red:1}); return; } var p=S.pending; S.pending=null; if(p){ var keepSel=S.sel, keepRoute=S.route; S.sel=p.sel; S.route=p.route; try{ p.fn(); } finally { S.sel=keepSel; S.route=keepRoute; } save(); paint(); toast('Saved','Retried '+p.label+' — done.'); } }

/* ---------- router ---------- */
function go(v,p,replace){
  var r={v:v}; if(p) for(var k in p) r[k]=p[k];
  if(!replace && S.route && S.route.v!=='signin'){ S.hist.push(S.route); if(S.hist.length>40) S.hist.shift(); }
  S.route=r; S.flow=null; S.sel={}; S.side=false; window.scrollTo(0,0); save(); paint();
}
function back(){ var r=S.hist.pop(); if(r){ S.route=r; S.flow=null; S.sel={}; window.scrollTo(0,0); save(); paint(); } else go('home',null,true); }

/* ---------- modal plumbing ---------- */
var FLOWS={};
function openFlow(id,init){ S.flow=id; S.sel=init||{}; paintModal(); }
function closeFlow(){ ctcReset(); S.flow=null; S.sel={}; document.getElementById('ovl').hidden=true; }
function paintModal(){
  var o=document.getElementById('ovl'); if(!S.flow){ o.hidden=true; return; }
  var f=FLOWS[S.flow]; if(!f){ S.flow=null; o.hidden=true; return; }
  var bodyHtml=f.body(); /* body first: a body may seed S.sel defaults that can() reads */
  var sub=typeof f.sub==='function'?f.sub():f.sub, okl=typeof f.ok==='function'?f.ok():(f.ok||'Confirm'), can=f.can?f.can():true;
  o.innerHTML='<div class="mod'+(f.wide?' wide':'')+'" role="dialog" aria-modal="true"><div class="modh"><div><div class="t">'+esc(typeof f.t==='function'?f.t():f.t)+'</div>'+
    (sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>'+(f.locked&&f.locked()?'':'<button class="x" data-close="1" aria-label="Close">'+ic('x')+'</button>')+'</div>'+
    '<div class="modb">'+bodyHtml+'</div>'+
    (f.nofoot&&f.nofoot()?'':'<div class="modf">'+(f.alt?'<button class="btn" data-alt="1">'+esc(f.alt.label)+'</button>':'')+'<span class="sp"></span>'+
      (f.nocancel&&f.nocancel()?'':'<button class="cancel" data-close="1">Cancel</button>')+
      '<button class="btn primary lg" data-commit="1"'+(can?'':' disabled')+'>'+esc(okl)+'</button></div>')+'</div>';
  o.hidden=false;
}
function flowLive(){ var f=FLOWS[S.flow]; if(!f) return; if(f.live){ f.live(); } var b=document.querySelector('#ovl [data-commit]'); if(b&&f.can){ b.disabled=!f.can(); var okl=typeof f.ok==='function'?f.ok():(f.ok||'Confirm'); b.textContent=okl; } }
function commit(){
  var f=FLOWS[S.flow]; if(!f||(f.can&&!f.can())) return;
  var keep=f.run();
  if(keep==='stay'){ paintModal(); return; }
  if(keep===true){ paintModal(); paint(); return; }
  if(keep==='fail'){ return; }
  closeFlow(); paint();
}

/* home buckets — 11b-sales-home-logic.md */
var QUIET_DAYS=30;
function homeBuckets(uid){
  var lines=S.data.lines.filter(function(l){return l.owner===uid;}), used={}, b={fresh:[],late:[],move:[],quiet:[],rest:[]};
  var order={esc:0,over:1,today:2};
  myTasks(uid).forEach(function(t){ var st=taskState(t); if(order[st]!==undefined) b.late.push(t); });
  b.late.sort(function(x,y){ return (order[taskState(x)]-order[taskState(y)]) || (x.dueAt-y.dueAt); });
  lines.forEach(function(l){ if(openLine(l) && l.stage===1 && !attempts(l)){ b.fresh.push(l); used[l.id]=1; } });
  b.fresh.sort(function(x,y){return x.assignedAt-y.assignedAt;});
  lines.forEach(function(l){ if(used[l.id]||dead(l)||l.stage>=SALES_STAGES) return;
    if(l.status==='park'){ if(l.revisit<=S.now){ b.move.push(l); used[l.id]=1; } else b.rest.push(l); return; }
    if(actingParty(l)==='Us'){ b.move.push(l); used[l.id]=1; return; }
    if(daysQuiet(l)>=QUIET_DAYS){ b.quiet.push(l); used[l.id]=1; return; }
    b.rest.push(l); });
  b.move.sort(function(x,y){return daysInStage(y)-daysInStage(x);});
  b.quiet.sort(function(x,y){return daysQuiet(y)-daysQuiet(x);});
  return b;
}

/* search */
function search(q){

document.addEventListener('click',function(e){
  var t=e.target; if(!(t instanceof Element)) return;
  var x;
  if(x=t.closest('[data-signin]')){ S.user=x.dataset.signin; S.flow=null; S.sel={}; S.hist=[]; delete S.ui.vw; /* [stated 23 Sep] each person starts in their own default view */ var u=me(); S.route={v:homeRoute(u)}; save(); paint(); return; }
  if(t.closest('[data-signout]')){ S.user=null; S.flow=null; S.route={v:'signin'}; save(); paint(); return; }
  if(t.closest('[data-switch]')){ openFlow('switchUser'); return; }
  if(t.closest('[data-proto]')){ openFlow('proto'); return; }
  if(t.closest('[data-reset]')){ reset(); return; }
  if(x=t.closest('[data-offline]')){ S.offline=x.dataset.offline==='1'; if(!S.offline && S.pending){ retry(); } paint(); if(S.flow==='proto') paintModal(); toast(S.offline?'Offline':'Back online',S.offline?'Saves will fail until you reconnect.':'Saving works again.'); return; }
  if(x=t.closest('[data-time]')){ var tv=x.dataset.time, n=null; if(tv==='0'){ S.now=T0.getTime(); } else if(tv.indexOf('next:')===0){ n=advanceClock(nextCheck(S.now,tv.slice(5))); } else { n=advanceClock(addWork(S.now,+tv)); } save(); paint(); if(S.flow==='proto') paintModal(); toast('Clock moved', tv==='0'?'Back to '+fmt(S.now):'Now '+fmt(S.now)+(n?' · '+plural(n.h,'hourly check')+', '+plural(n.d,'daily check')+' ran · '+plural(n.made,'task')+' created by rule'+(n.ren?' · '+plural(n.ren,'renewal line')+' opened':''):'')); return; }
  if(x=t.closest('[data-toastact]')){ if(x.dataset.toastact==='retry') retry(); var tt=x.closest('.toast'); if(tt) tt.remove(); if(x.dataset.toastact==='copyrfq') toast('Link copied'); return; }
  if(t.closest('[data-burger]')){ S.side=!S.side; document.getElementById('side').classList.toggle('open',S.side); return; }
  if(x=t.closest('[data-nav]')){ go(x.dataset.nav); return; }
  if(t.closest('[data-back]')){ back(); return; }
  /* screen handlers run before generic navigation so a control inside a clickable row wins */
  for(var i=0;i<HANDLERS.length;i++){ if(HANDLERS[i](t,e)) return; }
  if(x=t.closest('[data-go]')){ var p={}; if(x.dataset.id) p.id=x.dataset.id; if(x.dataset.tab) p.tab=x.dataset.tab; if(x.dataset.q!==undefined) p.q=x.dataset.q; go(x.dataset.go,p); return; }
  if(x=t.closest('[data-fold]')){ S.ui['fold_'+x.dataset.fold]=!x.closest('.fold').classList.contains('open'); x.closest('.fold').classList.toggle('open'); return; }
  if(x=t.closest('[data-pill]')){ S.ui[x.dataset.pill]=x.dataset.pv; paint(); return; }
  if(x=t.closest('[data-uiset]')){ S.ui[x.dataset.uiset]=x.dataset.uv; paint(); return; }
  /* modal */
  if(x=t.closest('[data-mset]')){ if(S.flow){ S.sel[x.dataset.mset]=x.dataset.mval; paintModal(); } return; }
  if(x=t.closest('[data-pick]')){ if(S.flow){ if(x.getAttribute('aria-disabled')==='true') return; S.sel.d=x.dataset.pick; paintModal(); } return; }
  if(x=t.closest('[data-tog]')){ if(S.flow){ var arr=S.sel[x.dataset.tog]=S.sel[x.dataset.tog]||[], v=x.dataset.tv, i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else arr.push(v); paintModal(); } return; }
  if(x=t.closest('[data-vw]')){ var want=x.dataset.vw; if((want==='team')!==teamView()){ S.ui.vw=want; var v=S.route.v;
      if(v==='home'||v==='rmhome'||v==='team'||v==='rmteam'){ S.route={v:homeRoute()}; }
      S.flow=null; S.sel={}; save(); paint(); } return; }
  if(t.closest('[data-close]')){ if(flowLocked()) return; closeFlow(); return; }
  if(t.closest('[data-commit]')){ commit(); return; }
  if(t.closest('[data-alt]')){ var f=FLOWS[S.flow]; if(f&&f.alt){ if(typeof f.alt.run==='function'){ f.alt.run(); } else openFlow(f.alt.flow,{line:S.sel.line}); } return; }
  if(t.classList.contains('ovl')){ if(flowLocked()) return; closeFlow(); return; }
  if(x=t.closest('[data-flow]')){ if(x.disabled) return; openFlow(x.dataset.flow,{line:x.dataset.line||(S.route.id||''),acct:x.dataset.acct||''}); return; }
});

/* tasks on this person, split the way the homepage shows them */
function hTasks(uid){ var over=[], today=[]; myTasks(uid).forEach(function(t){ var st=taskState(t); if(st==='esc'||st==='over') over.push(t); else if(st==='today') today.push(t); });
  var byDue=function(x,y){ return x.dueAt-y.dueAt; }; over.sort(byDue); today.sort(byDue);
  var tab=S.ui.htab||'today'; if(tab==='today'&&!today.length&&over.length) tab='over';
  return {over:over, today:today, tab:tab}; }
function hTaskCard(tk){ if(!tk.over.length&&!tk.today.length) return '';
  return hCard('tasks',tk.tab==='over'?'red':'amber','checks','Tasks',(tk.tab==='over'?tk.over:tk.today).map(hTaskRow),
    hSeg('htab',tk.tab,[['today','Due today',tk.today.length],['over','Overdue',tk.over.length,'red']]),
    tk.tab==='over'?'Nothing overdue.':'Nothing due today.'); }
/* newly assigned — not contacted yet, filtered by when it landed */
var HBANDS=[['d0','Today',0],['d3','Last 3 days',2],['d7','This week',6],['d30','This month',29]];
function hFreshCard(items){ /* items: [{l:line, at:timestamp, meta:html}] */
  if(!items.length) return '';
  var age=function(x){ return daysBetween(x.at,S.now); };
  var inBand=function(k){ var lim=0; HBANDS.forEach(function(y){ if(y[0]===k) lim=y[2]; }); return items.filter(function(x){ return age(x)<=lim; }); };
  var band=S.ui.nab||''; if(!band||!inBand(band).length){ band=''; HBANDS.forEach(function(y){ if(!band && inBand(y[0]).length) band=y[0]; }); if(!band) band='d0'; }
  return hCard('fresh','violet','sparkles','Newly assigned', inBand(band).map(function(x){ return hLineRow(x.l,x.meta); }),
    hSeg('nab',band,HBANDS.map(function(y){ return [y[0],y[1],inBand(y[0]).length]; })), 'Nothing assigned in this window.'); }
function hWhen(at){ var d=daysBetween(at,S.now); return d<=0?'today':(d===1?'yesterday':d+' days ago'); }
/* ---------- a manager's rows: the same card language, plus the one action they have ---------- */
/* [stated 23 Sep] a head opens the homepage to see what to work on now — escalations first,
   then what is slipping. No tables, no long lists, nothing that is only for looking at. */
function hMgrTaskRow(t){ var l=t.line?lineById(t.line):null, a=t.acct?acctOf(t.acct):null;
  var tgt=l?(shortName(acctName(l))+' · '+l.product):(a?shortName(a.n):'—');
  var h=Math.round(workMins(t.escAt||t.dueAt,S.now)/60), since=h<9?(h<1?'just now':h+(h===1?' hour':' hours')):Math.max(1,Math.round(h/9))+(Math.round(h/9)===1?' day':' days');
  return '<div class="hrow row" data-go="'+(l?'line':'acct')+'" data-id="'+(l?l.id:(a?a.id:''))+'"><div class="bd"><div class="tt">'+esc(t.title)+'</div>'+
    '<div class="mt">'+chip('Escalated '+since+' ago','red',true,true)+'<span>'+esc(tgt)+' · '+esc(uname(t.owner))+'</span></div></div>'+
    '<div class="rt">'+(l?'<button class="tk" data-flow="takeover" data-line="'+l.id+'">Take it over</button>':'')+'<button class="done" data-taskdone="'+t.id+'">'+ic('check')+'Close</button></div></div>'; }
function hSlipRow(l,meta){ return '<div class="hrow row" data-go="line" data-id="'+l.id+'"><div class="bd"><div class="tt">'+esc(shortName(acctName(l)))+' <span class="pr">· '+esc(l.product)+'</span></div><div class="mt">'+meta+'</div></div>'+
    '<div class="rt"><button class="tk" data-flow="takeover" data-line="'+l.id+'">Take it over</button>'+ic('chevright')+'</div></div>'; }
function hMgrHero(u,sub){ return '<div class="hhero"><div class="h1">'+esc(greetTx())+', '+esc(u.n.split(' ')[0])+'</div><span class="hday">'+ic('calendar')+esc(fmt(S.now).replace(/^today, /,'Today · '))+'</span></div>'+
    '<div class="sub">'+sub+'</div>'+diamonds(); }
/* [stated 23 Sep] a home list is short — five rows, then a count you can open */
var HMAX=5;
function hCut(key,rows){ var all=S.ui[key]==='all'; var out=all?rows.slice():rows.slice(0,HMAX);
  if(!all&&rows.length>HMAX) out.push('<button class="hmore" data-uiset="'+key+'" data-uv="all">'+esc((rows.length-HMAX)+' more')+ic('chevdown','ic14')+'</button>');
  if(all&&rows.length>HMAX) out.push('<button class="hmore" data-uiset="'+key+'" data-uv="">Show less'+ic('chevdown','ic14')+'</button>');
  return out; }
function hMgrClear(what){ return '<div class="mt16">'+empty('circlecheck','Nothing needs you right now',what)+'</div>'; }

SCREENS.pipeline=function(){
  var u=me(), f=S.ui.pf||'open', q=(S.ui.pq||'').toLowerCase(), prod=S.ui.pprod||'', st=S.ui.pstage||'';
  /* [stated 23 Sep] scoped by the view switch — own lines, or the team's */
  var lines=S.data.lines.filter(function(l){return inScope(l.owner,u);}), tv=teamView(u);
  var counts={open:lines.filter(openLine).length, post:lines.filter(postLine).length, issued:lines.filter(issuedLine).length, park:lines.filter(function(l){return l.status==='park';}).length, closed:lines.filter(dead).length, all:lines.length};
  var rows=lines.filter(function(l){
    if(f==='open'&&!openLine(l)) return false; if(f==='post'&&!postLine(l)) return false; if(f==='issued'&&!issuedLine(l)) return false; if(f==='park'&&l.status!=='park') return false; if(f==='closed'&&!dead(l)) return false;
    if(prod&&l.product!==prod) return false; if(st&&String(l.stage)!==st) return false;
    if(q&&(acctName(l)+' '+l.product+' '+l.id+' '+oppName(l)).toLowerCase().indexOf(q)<0) return false; return true;
  }).sort(function(x,y){ return (y.stage-x.stage)||(daysInStage(y)-daysInStage(x)); });

  var html='<div class="hdrow"><div><div class="h1">Pipeline</div><div class="sub">'+(tv?'Every product line your team owns, one row each.':'Every product line you own, one row each.')+' The stage names who must act next; open a row to work it.'+(u.role==='rm'?' Selling and post-purchase sit side by side — the stage tells them apart.':'')+'</div></div></div>'+diamonds()+
    pills('pf',f,[['open','Selling',counts.open],['post','Post-purchase',counts.post],['issued','Issued',counts.issued],['park','Parked',counts.park],['closed','Closed',counts.closed],['all','All',counts.all]])+
    '<div class="flex wrap mt12" style="gap:10px"><input class="inp" id="pq" data-ui="pq" style="max-width:280px" placeholder="Account, product, line or opportunity" value="'+esc(S.ui.pq||'')+'">'+
      '<select class="sel" data-uisel="pprod" style="max-width:220px"><option value="">All products</option>'+prods.map(function(p){return '<option'+(prod===p?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select>'+
      '<select class="sel" data-uisel="pstage" style="max-width:240px"><option value="">All stages</option>'+STAGES.map(function(s){return '<option value="'+s.n+'"'+(st===String(s.n)?' selected':'')+'>'+esc(s.s)+'</option>';}).join('')+'</select>'+
      (q||prod||st?'<button class="btn ghost sm" data-clearpf="1">Clear filters</button>':'')+'</div>'+
    '<div class="card mt16" style="overflow:hidden">'+(rows.length?'<div class="tw"><table class="t"><thead><tr><th>Line</th><th><span class="f">'+ic('chevdown')+'Stage</span></th><th>Waiting on</th><th>Account</th>'+(tv?'<th>Owner</th>':'')+'<th>Opportunity</th><th class="num">Premium</th><th>In stage</th></tr></thead><tbody>'+
      rows.map(function(l){ var w=actingParty(l); return '<tr class="row'+(dead(l)?' dim':'')+'" data-go="line" data-id="'+l.id+'"><td class="id">'+esc(l.id)+'<div class="sub" style="color:var(--ink);font-weight:500">'+esc(l.product)+'</div></td>'+
        '<td>'+chip(stageName(l.stage),l.stage===14?'green':(l.stage>=SALES_STAGES?'violet':(dead(l)?'red':(l.status==='park'?'amber':'neutral'))),true,true)+(l.status!=='open'?'<div class="sub">'+esc(statusTx(l))+'</div>':'')+'</td>'+
        '<td>'+chip(w,waitTone(w),false,true)+'</td><td class="nm">'+esc(acctName(l))+'</td>'+(tv?'<td>'+esc(uname(l.owner))+'</td>':'')+'<td>'+esc(oppName(l))+'</td><td class="num">'+(confirmed(l)?'<b class="b">'+INR(premOf(l))+'</b>':'<span class="meta">'+INR(premOf(l))+' est.</span>')+'</td>'+
        '<td>'+(l.stage===14?'—':plural(daysInStage(l),'day'))+'</td></tr>'; }).join('')+'</tbody></table></div>'
      : empty('filter', q||prod||st?'No line matches those filters':'No '+(f==='open'?'selling':(f==='post'?'post-purchase':f))+' lines', q||prod||st?'Clear a filter, or search for the account by name from the sidebar.':'Lines arrive from inbound enquiries, from <b>New opportunity</b>, or by reassignment.', q||prod||st?'<button class="btn" data-clearpf="1">Clear filters</button>':''))+'</div>';
  return {sc:'Pipeline', html:html};
};

SCREENS.tasks=function(){
  var u=me(), all=S.data.tasks.filter(function(t){return t.owner===u.id;}), f=S.ui.tf||'open', cls=S.ui.tcls||'';
  var open=all.filter(function(t){return !t.done;}), done=all.filter(function(t){return t.done;});
  var grp={esc:[],over:[],today:[],week:[],later:[]};
  open.forEach(function(t){ if(cls&&t.cls!==cls) return; var st=taskState(t); if(st==='esc'||st==='over'||st==='today'){ grp[st].push(t); return; } var d=daysBetween(S.now,t.dueAt); if(d<=7) grp.week.push(t); else grp.later.push(t); });
  var g=function(k,title,tone){ if(!grp[k].length) return ''; return '<section class="card"><div class="cardh"><span class="t">'+esc(title)+'</span>'+chip(grp[k].length,tone,false,true)+'</div><div class="rowlist">'+grp[k].sort(function(x,y){return x.dueAt-y.dueAt;}).map(function(t){return taskRow(t);}).join('')+'</div></section>'; };
  var html='<div class="hdrow"><div><div class="h1">Tasks</div><div class="sub">Only yours — a task cannot be held by anyone else. Grouped by when, not by kind: what is late comes before what kind of task it is.</div></div></div>'+diamonds()+
    '<div class="flex wrap" style="gap:10px">'+pills('tf',f,[['open','Open',open.length],['done','Done',done.length]])+'<span class="sp"></span><select class="sel" data-uisel="tcls" style="max-width:180px"><option value="">All classes</option><option'+(cls==='SLA'?' selected':'')+'>SLA</option><option'+(cls==='Follow-up'?' selected':'')+'>Follow-up</option><option'+(cls==='Manual'?' selected':'')+'>Manual</option></select></div>'+
    '<div class="gap12 mt16">'+(f==='done'
      ? (done.length?'<section class="card"><div class="rowlist">'+done.sort(function(x,y){return y.doneAt-x.doneAt;}).map(function(t){return taskRow(t);}).join('')+'</div></section>':empty('circlecheck','Nothing completed yet','Completed tasks stay here for the record; the line they were about is unchanged by them.'))
      : (open.length? g('esc','Escalated','red')+g('over','Overdue','red')+g('today','Due today','amber')+g('week','This week','violet')+g('later','Later','neutral')
        : empty('checks','No open tasks','A task arrives three ways: a rule fires when a line enters a stage, a disposition creates a follow-up, or you add one yourself.','<button class="btn" data-flow="addTask">'+ic('plus')+'Add task</button>')))+'</div>'+
    '<div class="mt16">'+note('violet','Escalation','SLA tasks escalate to your manager after their second clock. Follow-up and Manual tasks stop at Overdue — you chose their dates, so nobody is escalated for missing them.','info')+'</div>';
  return {sc:'Tasks', html:html, cta:'<button class="btn primary sm" data-flow="addTask">'+ic('plus')+'Add task</button>'};
};
FLOWS.addTask={t:'Add a task', sub:'For yourself, on a product line or an account. Class is always Manual — a user cannot create an SLA task.',
  body:function(){
    var u=me(), mine=S.data.lines.filter(function(l){return l.owner===u.id && openLine(l);});
    var preset=S.sel.line||''; var opts=[['','Choose a line']].concat(mine.map(function(l){return [l.id,acctName(l)+' · '+l.product];}));
    var dueMin=ymd(S.now);
    return field('Task', input('title',S.sel.title,'What needs doing'))+
      field('Attach to', select('lineId',S.sel.lineId||preset,opts))+
      field('Due', '<input class="inp" id="f_due" data-f="due" type="date" min="'+dueMin+'" value="'+esc(S.sel.due||'')+'">','The calendar starts at today and will not go earlier.', S.sel.due&&S.sel.due<dueMin?'A due date cannot be in the past.':'')+
      note('neutral','','Class <b>Manual</b>. It goes Pending → Overdue and never escalates.');
  },
  can:function(){ return !!(S.sel.title||'').trim() && !!(S.sel.lineId||S.sel.line) && !!S.sel.due && S.sel.due>=ymd(S.now); }, ok:'Add task',
  run:function(){ var due=new Date(S.sel.due+'T18:00:00').getTime(); var lid=S.sel.lineId||S.sel.line;
    return write(function(){ S.data.tasks.push({id:'T-'+(S.data.seq.task++),line:lid,acct:null,owner:S.user,title:S.sel.title.trim(),cls:'Manual',createdAt:S.now,dueAt:due,escAt:0,done:0,doneAt:0,doneBy:'',rule:''}); },'the new task') ? undefined : 'fail'; }};
HANDLERS.push(function(t){
  var x=t.closest('[data-taskdone]'); if(!x) return false;
  var task=by(S.data.tasks,x.dataset.taskdone); if(!task) return true;
  /* [stated 24 Sep · TBD-37] a manager closing someone else's escalated task has to say why —
     it disappears from the owner's list too, so the record must name who closed it and on what
     grounds. Closing your own task needs no reason. */
  if(task.owner!==S.user){ openFlow('closeTask',{task:task.id}); return true; }
  var ok=write(function(){ task.done=1; task.doneAt=S.now; task.doneBy=S.user; var l=lineById(task.line); if(l) fireRules(l); }, 'completing the task');
  if(ok){ toast('Task completed','Off your list. The line has not moved — completing a task never changes a stage.'); paint(); } else { x.checked=false; }
  return true;
});
var CLOSE_WHY=['Already done — the owner did it off-system','No longer relevant','Duplicate of another task','I am taking the line over','Wrong owner'];
FLOWS.closeTask={t:'Close an escalated task', sub:'It leaves the owner’s list as well as yours, so the record names you and why.',
  body:function(){ var tk=by(S.data.tasks,S.sel.task)||{}, l=tk.line?lineById(tk.line):null;
    return note('amber','','<b>“'+esc(tk.title||'')+'”</b> belongs to '+esc(uname(tk.owner))+(l?' on '+esc(l.id)+' · '+esc(l.product):'')+'. Closing it here closes it for them. The line does not move.','info')+
      field('Why you are closing it',select('why',S.sel.why||CLOSE_WHY[0],CLOSE_WHY))+
      field('Note — optional',input('x',S.sel.x,'Anything the owner should know')); },
  can:function(){ return !!(by(S.data.tasks,S.sel.task)); }, ok:'Close the task',
  run:function(){ var tk=by(S.data.tasks,S.sel.task); if(!tk) return 'fail';
    var why=(S.sel.why||CLOSE_WHY[0])+((S.sel.x||'').trim()?' · '+S.sel.x.trim():'');
    var ok=write(function(){ tk.done=1; tk.doneAt=S.now; tk.doneBy=S.user; tk.closeWhy=why;
      var l=lineById(tk.line);
      if(l){ logAdd(l,'Escalated task closed by '+uname(S.user),'“'+tk.title+'” · owner '+uname(tk.owner)+' · '+why+' · the line did not move','sys',1); fireRules(l); }
    },'closing the task'); if(!ok) return 'fail';
    toast('Task closed','Closed for '+uname(tk.owner)+' too. Reason on the record; the line has not moved.'); }};

/* ---------- tickets: placement, payment, post-purchase, endorsements and claims — one list ---------- */
function ticketRows(u){
  var rows=[], mineLines=function(l){ return l.owner===u.id; };
  /* [stated 23 Sep] the view switch scopes this list too */
  var scopeLines = hasViews(u)&&!teamView(u) ? mineLines
                 : (u.role==='mgr' ? function(l){ var o=userById(l.owner); return l.owner===u.id||(o&&o.mgr===u.id); }
                 : (u.role==='rmhead' ? function(l){ var o=userById(l.owner); return (o&&o.mgr===u.id)||l.owner===u.id; } : mineLines));
  var scopeAcct = function(a){ if(!a) return false;
    if(hasViews(u)&&!teamView(u)) return a.own===u.id||linesOfAcct(a.id).some(mineLines);
    if(u.role==='rm') return a.own===u.id;
    if(u.role==='rmhead') return a.own===u.id||rmTeam(u.id).some(function(x){return x.id===a.own;});
    if(u.role==='mgr') return linesOfAcct(a.id).some(scopeLines);
    return linesOfAcct(a.id).some(mineLines); };
  S.data.lines.forEach(function(l){ if(!scopeLines(l)) return; ticketsOf(l).forEach(function(t){ rows.push({id:t.id, kind:t.ty, k:t.ty==='Placement'?'plc':(t.ty==='Payment'?'pay':'iss'), st:t.st, tone:t.tone, closed:t.st==='Closed'||t.st==='Withdrawn', acct:acctName(l), sub:l.product+' · '+l.id, wait:t.ty==='Post-purchase'?issWaiting(l):(t.pend?'You':'Desk'), need:!!(t.act&&canAct(l)), pend:t.pend, raised:t.raised, go:'ticket'}); }); });
  S.data.svc.forEach(function(t){ var a=acctOf(t.acct); if(!scopeAcct(a)) return; var nd=svcNeed(t); rows.push({id:t.id, kind:t.k==='clm'?'Claim':'Endorsement', k:t.k, st:t.stage, tone:svcClosed(t)?'green':(nd?'amber':'violet'), closed:svcClosed(t), acct:a?a.n:t.acct, sub:t.sub+' · '+t.pol, wait:nd?(svcCanAct(t)?'You':uname(a.own)):t.wait, need:nd&&svcCanAct(t), pend:nd?(t.query&&t.query.open?'A query from the desk is waiting for a reply.':'Documents the desk asked for are still outstanding.'):'', raised:t.raised, go:'svctix'}); });
  return rows.sort(function(x,y){ return (y.need-x.need)||(y.raised-x.raised); });
}

  }

/* ==================================================================== *
 *  Verifying a provisional account — [stated 24 Sep]
 *  The documents are uploaded here: the PAN card, and then either the GST
 *  certificate or, for a proprietor with no GST, Aadhaar. OCR reads the
 *  numbers AND the legal name off the PAN; the name on the account is
 *  replaced by the name on the card, and the change is shown before it is
 *  written. PAN is still validated against the PAN inside the GSTIN.
 * ==================================================================== */
/* the legal name a PAN card carries: the registry form, in capitals */
function panLegalName(a){
  var n=String(a.n||'').trim()
    .replace(/\bPvt\.?\b/ig,'Private').replace(/\bLtd\.?\b/ig,'Limited')
    .replace(/\s+/g,' ').toUpperCase();
  if(!/(PRIVATE LIMITED|PUBLIC LIMITED|LIMITED|LLP|PARTNERSHIP|ENTERPRISES|& SONS)$/.test(n) && !a.sole) n+=' PRIVATE LIMITED';
  return n;
}
function kycDoc(kind,a){
  var W=420,H=260, t=function(x,y,s,sz,w,col){ return '<text x="'+x+'" y="'+y+'" font-family="Arial" font-size="'+sz+'" font-weight="'+(w||400)+'" fill="'+(col||'#171630')+'">'+String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</text>'; };
  var head={pan:'INCOME TAX DEPARTMENT',gst:'GOODS AND SERVICES TAX',aad:'UNIQUE IDENTIFICATION AUTHORITY OF INDIA'}[kind];
  var body='';
  if(kind==='pan') body=t(24,96,'Name',11,600,'#8C8CA3')+t(24,116,panLegalName(a),13,700)+t(24,152,'Permanent Account Number',11,600,'#8C8CA3')+t(24,176,a.pan||'AAAAA9999A',20,700)+t(24,214,'Signature',11,600,'#8C8CA3');
  if(kind==='gst') body=t(24,96,'Registration Number',11,600,'#8C8CA3')+t(24,118,a.gst||'27AAAAA9999A1Z5',15,700)+t(24,152,'Legal Name',11,600,'#8C8CA3')+t(24,172,panLegalName(a),12,700)+t(24,204,'Principal Place of Business',11,600,'#8C8CA3')+t(24,222,(a.city||'')+(a.st?', '+a.st:''),12,600);
  if(kind==='aad') body=t(24,96,'Aadhaar',11,600,'#8C8CA3')+t(24,120,a.aad||'XXXX XXXX 4412',18,700)+t(24,156,'Name',11,600,'#8C8CA3')+t(24,176,'RAMANLAL VORA',13,700)+t(24,208,'Proprietor of',11,600,'#8C8CA3')+t(24,226,a.n||'',12,600);
  var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><rect width="'+W+'" height="'+H+'" rx="10" fill="#EEF1F7"/><rect x="10" y="10" width="'+(W-20)+'" height="'+(H-20)+'" rx="6" fill="#fff"/>'+
    '<rect x="10" y="10" width="'+(W-20)+'" height="46" rx="6" fill="#171630"/>'+t(24,39,head,12,700,'#fff')+body+'</svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function kycRoute(){ return S.sel.route||'gst'; }
function kycSecondName(){ return kycRoute()==='gst'?'GST certificate':'Aadhaar'; }
function kycReadNow(){
  if(S.flow!=='kyc') return; var a=KA();
  S.sel.read=1;
  var pan=(S.sel.pan||a.pan||'AABCX1234K').toUpperCase(); S.sel.pan=pan;
  if(kycRoute()==='gst') S.sel.gst=S.sel.mis?'27AABCZ9999Z1ZQ':(a.gst||('27'+pan+'1Z5'));
  else S.sel.aad=a.aad||'XXXX XXXX 4412';
  S.sel.ocrname=panLegalName(a);
  paintModal();
}
function KA(){ var l=lineById(S.sel.line||'')||null; return l?acctOf(l):by(S.data.accounts,S.sel.acct||S.route.id); }
FLOWS.kyc={t:'Get the account verified', sub:function(){ return S.sel.read?'Read off the documents. Check the legal name before it is written to the account.':'Upload the PAN card, and the GST certificate — or Aadhaar, where there is no GST.'; },
  body:function(){ var a=KA(), r=kycRoute();
    if(S.sel.read){
      var pan=(S.sel.pan||'').toUpperCase(), gst=(S.sel.gst||'').toUpperCase(), aad=(S.sel.aad||'');
      var match=r==='aad'||gst.slice(2,12)===pan, dup=r==='gst'?S.data.accounts.filter(function(x){return x.id!==a.id&&x.gst&&x.gst.toUpperCase()===gst;})[0]:null;
      var nm=(S.sel.ocrname||'').trim(), changed=nm&&nm!==a.n;
      return (match?note('green','','<b>Read and validated.</b> '+(r==='gst'?'The ten characters inside the GSTIN are the PAN on the card.':'No GST on a proprietorship, so Aadhaar stands in for the registration certificate.')):note('red','PAN does not match the GSTIN','The PAN inside the GSTIN is '+esc(gst.slice(2,12)||'—')+'; the PAN card reads '+esc(pan)+'. One of the two documents is wrong. Go back and re-upload.','alert'))+
        '<div class="fgrid">'+field('PAN read from the card',input('pan',pan,'AAAAA9999A'))+
          (r==='gst'?field('GSTIN read from the certificate',input('gst',gst,'15 characters')):field('Aadhaar read from the document',input('aad',aad,'XXXX XXXX 9999')))+'</div>'+
        /* [stated 24 Sep] the legal name comes off the PAN, and replaces what was typed */
        field('Legal name as per PAN',input('ocrname',nm,''),'Read by OCR from the PAN card. This is what the account will be called.')+
        (changed?note('amber','The name on the account will change','<div class="kycname"><span class="kn-o">'+esc(a.n)+'</span>'+ic('arrowright','ic14')+'<span class="kn-n">'+esc(nm)+'</span></div>Every screen, document and search that names this account follows the PAN from here. The name that was typed at creation is kept on the activity trail.','info'):
          note('blue','','The name on the account already matches the PAN card. Nothing to change.'))+
        (match&&dup?note('amber','Matches an existing account','<b>'+esc(dup.n)+'</b> ('+dup.id+') already carries this GSTIN. This provisional account will merge into it: the line moves across, and '+esc(uname(dup.own))+' keeps the account.'):'');
    }
    var up=function(k,label,hint){
      var img=S.sel[k+'img'];
      return field(label, img?'<div class="kycup"><img src="'+img+'" alt="'+esc(label)+'"><div class="kycup-m"><b>'+esc(S.sel[k+'name']||label)+'</b><span class="green">'+ic('circlecheck','ic14')+'Uploaded</span><button type="button" class="quiet" data-kycclear="'+k+'">Replace</button></div></div>'
        : '<label class="pdrop sm" for="f_'+k+'"><input type="file" id="f_'+k+'" accept="image/png,image/jpeg,application/pdf" data-kycup="'+k+'" hidden>'+ic('upload','ic20')+'<b>Upload the '+esc(label.toLowerCase())+'</b><span>'+esc(hint)+'</span></label>', img?'':hint); };
    return '<div class="field"><div class="lbl">Second document</div>'+seg('route',[['gst','GST certificate'],['aad','Aadhaar — no GST']],'gst')+
        '<div class="hint">'+esc(r==='gst'?'A registered business. PAN is checked against the PAN inside the GSTIN.':'A proprietor with no GST registration. Aadhaar stands in for the registration certificate.')+'</div></div>'+
      up('pan','PAN card','An image or a PDF of the card')+
      up('doc',kycSecondName(),r==='gst'?'Form GST REG-06':'The proprietor’s Aadhaar')+
      note('blue','','Both documents are read by OCR — the numbers, and the legal name on the PAN.')+
      simblock('Prototype','The OCR is faked here. In the product these are read on upload.',
        '<button type="button" class="simbtn" data-kycsample="1">Use sample documents</button>'+
        (S.sel.panimg&&S.sel.docimg?'<button type="button" class="simbtn" data-kycmis="1">'+(S.sel.mis?'✓ PAN will not match the GSTIN':'Make the PAN mismatch the GSTIN')+'</button>':'')); },
  can:function(){ if(!S.sel.read) return !!S.sel.panimg&&!!S.sel.docimg;
    var pan=(S.sel.pan||'').trim().toUpperCase();
    if(!/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)) return false;
    if(!(S.sel.ocrname||'').trim()) return false;
    if(kycRoute()==='aad') return !!(S.sel.aad||'').trim();
    var gst=(S.sel.gst||'').trim().toUpperCase(); return gst.length===15&&gst.slice(2,12)===pan; },
  ok:function(){ return S.sel.read?'Verify and update the name':'Read the documents'; },
  run:function(){ var l=lineById(S.sel.line||'')||null, a=KA(), r=kycRoute();
    if(!S.sel.read){ kycReadNow(); return 'stay'; }
    var pan=S.sel.pan.trim().toUpperCase(), gst=r==='gst'?S.sel.gst.trim().toUpperCase():'', aad=r==='aad'?S.sel.aad.trim():'';
    var nm=(S.sel.ocrname||'').trim(), was=a.n, dup=r==='gst'?S.data.accounts.filter(function(x){return x.id!==a.id&&x.gst&&x.gst.toUpperCase()===gst;})[0]:null;
    var ok=write(function(){
      if(dup){ S.data.lines.forEach(function(x){ if(x.acct===a.id) x.acct=dup.id; }); S.data.opps.forEach(function(x){ if(x.acct===a.id) x.acct=dup.id; }); a.con.forEach(function(c){ if(!dup.con.some(function(d){return d.e===c.e;})) dup.con.push(c); }); S.data.accounts.splice(S.data.accounts.indexOf(a),1); linesOfAcct(dup.id).forEach(function(x){ logAdd(x,'KYC verified — merged into '+dup.n,'System · '+dup.id+' keeps its owner '+uname(dup.own),'sys',1); }); return; }
      a.pan=pan; if(gst) a.gst=gst; if(aad) a.aad=aad; a.prov=0;
      if(nm&&nm!==a.n){ a.nWas=was; a.n=nm; }
      linesOfAcct(a.id).forEach(function(x){
        logAdd(x,'KYC verified','System · '+(r==='gst'?'PAN matched the PAN inside the GSTIN':'PAN and Aadhaar read — proprietorship, no GST')+' · uploaded by '+uname(S.user),'sys',1);
        if(nm&&nm!==was) logAdd(x,'Legal name updated from the PAN card','System · OCR read “'+nm+'” · was “'+was+'”','sys',1);
      });
    },'the verification');
    if(!ok) return 'fail';
    if(!l){ closeFlow(); go('acct',{id:dup?dup.id:a.id}); }
    toast(dup?'Merged into '+dup.n:'Account verified', dup?'The line moved across. '+uname(dup.own)+' keeps the account; you keep the line.':(nm&&nm!==was?'Renamed to '+nm+' from the PAN card. The KYC gate before payment is now open.':'The KYC gate before payment is now open.')); }};

var PAN_RE=/^[A-Z]{5}[0-9]{4}[A-Z]$/, GST_RE=/^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;

function matchAcct(pan,gst){
  pan=(pan||'').toUpperCase(); gst=(gst||'').toUpperCase();
  if(gst.length===15){ var g=S.data.accounts.filter(function(a){return a.gst&&a.gst.toUpperCase()===gst;})[0]; if(g) return {a:g,how:'GSTIN'}; }
  if(PAN_RE.test(pan)){ var ps=S.data.accounts.filter(function(a){return a.pan&&a.pan.toUpperCase()===pan;}); if(ps.length===1) return {a:ps[0],how:'PAN'}; if(ps.length>1) return gst.length===15?null:{a:null,many:ps}; }
  return null;
}
function newOppErr(){
  var e={}, pan=noVal('pan').toUpperCase(), gst=noVal('gst').toUpperCase(), m=noVal('m').replace(/[\s\-]/g,''), em=noVal('e');
  if(pan&&!PAN_RE.test(pan)) e.pan='Five letters, four digits, one letter — e.g. AABCS1234F.';
  if(gst&&!GST_RE.test(gst)) e.gst='15 characters: 2-digit state code, the PAN, then 3 more.';
  if(!e.gst&&gst&&pan&&gst.slice(2,12)!==pan) e.gst='The PAN inside this GSTIN is '+gst.slice(2,12)+' — it does not match the PAN above.';
  if(m&&!/^(\+91)?[6-9]\d{9}$/.test(m)) e.m='An Indian mobile: 10 digits, optionally +91.';
  if(em&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) e.e='Not an email address.';
  return e;
}

/* ==================================================================== *
 *  Ticket screen — placement (PLC) and payment (PAY) tickets, derived from
 *  the line. Order on the page: where the ticket is and what to do (hero +
 *  track), what the ticket is about (details), then what happened (activity).
 * ==================================================================== */
var PLC_QUERY='New India want the maximum foreseeable loss working for the godown block before they will quote. Can you get it from the client?';
var PLC_DESK='Meera Iyer';

function tkLog(l,re,last){ var e=l.log.filter(function(x){return re.test(x.t);}).sort(function(a,b){return a.at-b.at;}); return e.length?(last?e[e.length-1]:e[0]):null; }
function tkAt(l,re,last){ var e=tkLog(l,re,last); return e?e.at:0; }
function plcRaisedAt(l){ return (l.rfq&&l.rfq.floatedAt)||tkAt(l,/floated to placement|Stage entered: Quote Requested/i)||l.enteredAt; }
function payRaisedAt(l){ return tkAt(l,/^Payment ticket PAY-/)||tkAt(l,/Stage entered: Purchase Requested/)||l.enteredAt; }
function tkRupee(v){ v=String(v||'').trim(); if(!v) return '—'; return v.indexOf('₹')===0?v:'₹'+v; }
function tkAmt(l){ return l.amt||premOf(l); }

/* the steps, oldest first; st: done | now | '' (still to come) */
function ticketSteps(t){
  var l=t.line, s=[];
  if(t.ty==='Placement'){
    s.push({t:'Raised',m:'by '+uname(l.owner),at:plcRaisedAt(l),st:'done'});
    if(l.round===1||l.qAns){ var q=(l.stage===6&&!l.qAns&&l.round===1); s.push({t:q?'Query from placement':'Query answered',m:q&&!dead(l)?'Waiting on you':'',at:q?0:tkAt(l,/Replied to placement query/,1),st:q?(dead(l)?'':'now'):'done'}); }
    var backs=l.log.filter(function(e){return /Quotes returned by placement/.test(e.t);}).sort(function(a,b){return a.at-b.at;});
    for(var r=1;r<=l.round;r++){
      var issued=l.stage>=7||r<l.round, working=!issued&&l.stage===6&&(l.qAns||r>1)&&!dead(l);
      s.push({t:'QCR v'+r+' received',m:working?'Placement is on it':'',at:issued&&backs[r-1]?backs[r-1].at:0,st:issued?'done':(working?'now':'')});
      if(r<l.round) s.push({t:'Sent back',m:'for v'+(r+1),at:tkAt(l,new RegExp('v'+(r+1)+' requested')),st:'done'});
    }
    s.push({t:'Sent to the client',m:l.stage===7?'Your review':'',at:l.stage>=8?tkAt(l,/QCR v\d+ (sent to|shared with) client/,1):0,st:l.stage>=8?'done':(l.stage===7&&!dead(l)?'now':'')});
    s.push({t:'Closed',m:l.stage>=9?(l.picked||''):(l.stage===8?'When the client confirms':''),at:l.stage>=9?tkAt(l,/Client confirmed insurer/,1):0,st:l.stage>=9?'done':(l.stage===8&&!dead(l)?'now':'')});
  } else {
    var paid=l.pay==='paid'||l.stage>=SALES_STAGES;
    s.push({t:'Raised',m:'by '+uname(l.soldBy||l.owner),at:payRaisedAt(l),st:'done'});
    s.push({t:'Ops prepares the details',m:l.pay==='ticket'?'With Ops':'',at:l.pay==='ticket'?0:tkAt(l,/Payment details returned by Ops/,1),st:l.pay==='ticket'?'now':'done'});
    s.push({t:'Sent to the client',m:l.pay==='back'?'Waiting on you':'',at:(l.pay==='shared'||paid)?tkAt(l,/Payment details shared/,1):0,st:l.pay==='back'?'now':((l.pay==='shared'||paid)?'done':'')});
    s.push({t:'Paid',m:l.pay==='shared'?'Waiting for the screenshot':'',at:paid?(l.paidAt||0):0,st:paid?'done':(l.pay==='shared'?'now':'')});
  }
  return s;
}

/* what the ticket is waiting for, in one sentence, with the action that moves it */
function tkHead(t){
  var l=t.line, who=l.contact.n||'the client';
  if(t.ty==='Placement'){
    if(l.stage>=9) return {tone:'green',k:'Closed',hl:'Client confirmed '+(l.picked||'an insurer'),w:'The ticket closed when the client confirmed a quote.',acts:[]};
    if(dead(l)) return {tone:'neutral',k:'Closed',hl:'Closed with the line — '+statusTx(l).toLowerCase(),w:l.reason||'',acts:[]};
    if(l.stage===8) return {tone:'blue',k:'Waiting on the client',hl:'QCR v'+l.round+' is with '+who,w:'The ticket closes when the client confirms a quote.',acts:[]};
    if(l.stage===7) return {tone:'amber',k:'Needs you',hl:'QCR v'+l.round+' is back from placement. Review it',w:'Send it to '+who+' as it is, or send it back for revision.',acts:[['qcr','Review the QCR']]};
    if(l.stage===6&&!l.qAns&&l.round===1) return {tone:'amber',k:'Needs you',hl:'Placement has a query for you',w:'Nothing moves until you answer it.',acts:[['answerQ','Answer the query']]};
    return {tone:'violet',k:'Waiting on placement',hl:l.round>1?'Placement is reworking the QCR — v'+l.round:'Placement is building QCR v1',w:'They approach the insurers and compare the quotes. The QCR comes back on this ticket.',acts:[]};
  }
  var m=payModeOf(l);
  if(l.pay==='paid'||l.stage>=SALES_STAGES) return {tone:'green',k:'Closed',hl:'Paid — '+INR(tkAmt(l))+' confirmed',w:'Handed over to '+uname(l.owner)+' with the payment screenshot.',acts:[]};
  if(dead(l)) return {tone:'neutral',k:'Closed',hl:'Closed with the line — '+statusTx(l).toLowerCase(),w:'',acts:[]};
  if(l.pay==='ticket') return {tone:'violet',k:'Waiting on Ops',hl:'Ops is preparing the '+m+' details',w:'They come back on this ticket. You check them, then send them to '+who+'.',acts:[]};
  if(l.pay==='back') return {tone:'amber',k:'Needs you',hl:'The '+m+' details are in. Check them and send them to '+who,w:'',acts:[['share','Share with client']]};
  return {tone:'blue',k:'Waiting on the client',hl:'Details sent to '+who+'. Waiting for the payment screenshot',w:'When it arrives, upload it to confirm the payment.',acts:[['proof','Confirm payment'],['share','Resend']]};
}

/* the trail: what the log holds for this ticket, plus its raising when the log predates it */
function tkTrail(t){
  var l=t.line, re=t.ty==='Placement'?/floated to placement|placement|QCR|Quotes returned|Client confirmed insurer|revision/i:/^Payment|payment details|Payment screenshot|Ownership transferred/i;
  var ev=l.log.filter(function(e){ return re.test(e.t)&&!/^Stage entered/.test(e.t); }).map(function(e){ return {t:e.t,m:e.m,at:e.at,sys:e.sys}; });
  var raisedLogged=ev.some(function(e){ return t.ty==='Placement'?/floated to placement/i.test(e.t):/^Payment ticket PAY-/.test(e.t); });
  if(!raisedLogged) ev.push({t:'Ticket '+t.id+' raised',m:uname(t.ty==='Payment'?(l.soldBy||l.owner):l.owner)+(t.ty==='Placement'?' · RFQ floated to '+t.desk:' · '+INR(tkAmt(l))+' · '+payModeOf(l)),at:t.ty==='Placement'?plcRaisedAt(l):payRaisedAt(l),sys:1});
  return ev.sort(function(a,b){ return b.at-a.at; });
}

function tkSims(t){

/* ==================================================================== *
 *  Task rules — the configurator (spec 07 v3). Admin here is the sales
 *  manager or the RM head. A rule is a condition set, not a trigger:
 *    rule = { id, n, when:[[cond]], pf, rt, ot, ap, pp, gp,
 *             waitN, waitU, recheck:'off'|'hourly'|'daily',
 *             ti, cl:'sla'|'fu', du, duu, ec, ecu, repeat, max,
 *             closeWhen:[[cond]], from, until, sea, act, fd }
 *    cond = { type:'stage'|'status'|'disp'|'task', op:'is'|'isnot', value, task }
 *  AND inside a group, OR between groups. The engine runs on every
 *  event on a line and at the hourly / daily checks when the clock moves.
 * ==================================================================== */
/* [stated 24 Sep · TBD-05] Unreachable joins the list — rules can be written against it */
var STATUS_OPTS=[['open','Open'],['park','Time Pending'],['lost','Lost'],['disq','Disqualified'],['noapp','No Appetite'],['unreach','Unreachable'],['withdrawn','Withdrawn']];
var TSTATE_OPTS=[['pending','Pending'],['over','Overdue'],['esc','Escalated'],['done','Done']];
var RECHECK_OPTS=[['off','Off'],['hourly','Hourly'],['daily','Daily']];
function C(type,op,value,task){ return {type:type,op:op,value:String(value),task:task||''}; }
function statusLabel(v){ for(var i=0;i<STATUS_OPTS.length;i++) if(STATUS_OPTS[i][0]===v) return STATUS_OPTS[i][1]; return v; }
function tstateLabel(v){ for(var i=0;i<TSTATE_OPTS.length;i++) if(TSTATE_OPTS[i][0]===v) return TSTATE_OPTS[i][1]; return v; }

/* ---------- the working calendar, held in S.data.cfg ---------- */
function cfg(){ if(!S.data.cfg) S.data.cfg={ws:10,we:19,dailyH:10,hol:HOL.slice()}; return S.data.cfg; }
function applyCfg(){ var c=cfg(); WH.start=c.ws; WH.end=c.we; HOL.length=0; c.hol.forEach(function(h){ HOL.push(h); }); }
function nextCheck(after,kind){
  var c=cfg(), d=new Date(after); d.setMinutes(0,0,0); d=new Date(d.getTime()+3600000); var g=0;
  while(g++<24*60){ var h=d.getHours();
    if(isWorkDay(d) && (kind==='hourly' ? (h>=c.ws && h<c.we) : h===c.dailyH)) return d.getTime();
    d=new Date(d.getTime()+3600000); }
  return after+3600000;
}

/* ---------- reading a line for the conditions ---------- */
function lastDisp(l){ if(l.lastDisp) return l.lastDisp; for(var i=0;i<(l.log||[]).length;i++){ var e=l.log[i]; if(e.kind==='call'){ var m=/^Call · (.+)$/.exec(e.t); if(m) return m[1]; } } return ''; }
function dispGroupOf(name){ var d=DISP.filter(function(x){return x.n===name;})[0]; return d?(d.g==='A'?'nc':'c'):''; }
function taskStateOf(t){ var s=taskState(t); return s==='today'?'pending':s; }
function latestTaskTitled(l,title){ var ts=tasksOfLine(l.id).filter(function(t){return t.title===title;}); return ts.length?ts[ts.length-1]:null; }
/* which other rules point at a task title in their conditions — a rename is refused while any do */
function titleRefs(title,skipId){ var out=[]; S.data.rules.forEach(function(q){ if(q.id===skipId) return;
  [q.when,q.closeWhen].forEach(function(gs){ (gs||[]).forEach(function(g){ g.forEach(function(c){ if(c.type==='task'&&c.task===title&&out.indexOf(q.id)<0) out.push(q.id); }); }); }); }); return out; }
function evalCond(c,l){
  var v=false;
  if(c.type==='stage') v= l.stage===+c.value;
  else if(c.type==='status') v= l.status===c.value;
  else if(c.type==='disp'){ var d=lastDisp(l); if(!d) v=false; else if(String(c.value).indexOf('group:')===0) v= dispGroupOf(d)===c.value.slice(6); else v= d===c.value; }
  /* [stated 24 Sep · TBD-42] a task the SYSTEM closed does not count as Done. Only a person
     finishing the work satisfies a Done condition, so a chained rule does not fire off a
     self-closing task. */
  else if(c.type==='task'){ var t=latestTaskTitled(l,c.task); v= !!t && taskStateOf(t)===c.value && !(c.value==='done'&&t.doneBy==='system'); }
  return c.op==='isnot' ? !v : v;
}
function hasConds(gs){ return !!gs && gs.some(function(g){ return g.length>0; }); }
function evalGroups(gs,l){ return hasConds(gs) && gs.some(function(g){ return g.length>0 && g.every(function(c){ return evalCond(c,l); }); }); }
function ruleFilters(r,l){
  if(r.pf&&r.pf.length&&r.pf.indexOf(l.product)<0) return false;
  if(r.rt==='dau'&&l.rate!==1) return false; if(r.rt==='plc'&&l.rate!==0) return false;
  /* [stated 23 Sep] a renewal is a line, not an opportunity — read the line */
  if(r.ot==='ren'&&!isRen(l)) return false; if(r.ot==='new'&&isRen(l)) return false;
  if(r.ap==='ppl'&&(r.pp||[]).indexOf(l.owner)<0) return false;
  if(r.ap==='grp'&&!(GROUPS[r.gp]||[]).some(function(u){return u===l.owner;})) return false;
  return true;
}
function ruleLive(r){ if(!r.act) return false; var d=ymd(S.now); if(r.from&&d<r.from) return false; if(r.until&&d>r.until) return false; return true; }
function ruleApplies(r,l){ return ruleLive(r) && ruleFilters(r,l); }

/* ---------- per line, per rule: the turn ---------- */
function rtOf(l,id){ if(!l.rt) l.rt={}; if(!l.rt[id]) l.rt[id]={wasTrue:false,since:0,turnMade:false,count:0}; return l.rt[id]; }
function openTasksOf(l,rid){ return tasksOfLine(l.id).filter(function(t){ return !t.done && t.rule===rid; }); }
function lastDoneAt(l,rid){ var m=0; tasksOfLine(l.id).forEach(function(t){ if(t.done&&t.rule===rid&&t.doneAt>m) m=t.doneAt; }); return m; }
function waitEnd(r,l,rs){ if(!(+r.waitN>0)) return 0; var ld=lastDoneAt(l,r.id), base=(r.repeat&&rs.turnMade&&ld)?ld:(rs.since||S.now); return addWork(base,durMins(+r.waitN,r.waitU)); }
function blockReason(r,l,rs){
  if(!r.repeat && rs.turnMade) return {k:'turn',tx:'Already created for this turn'};
  if(openTasksOf(l,r.id).length) return {k:'open',tx:'Its last task is still open'};
  if(r.repeat && +r.max>0 && rs.count>=+r.max) return {k:'max',tx:'Maximum of '+r.max+' reached'};
  var we=waitEnd(r,l,rs); if(we && S.now<we) return {k:'wait',tx:'Waiting until '+fmt(we)};
  return null;
}
function rlog(kind,l,t,m){ if(!S.data.rlog) S.data.rlog=[]; S.data.rlog.unshift({at:S.now,kind:kind,line:l?l.id:'',t:t,m:m||''}); if(S.data.rlog.length>240) S.data.rlog.length=240; }
var RUN={closed:0};
function closeBySystem(t,l,r){ t.done=1; t.doneAt=S.now; t.doneBy='system'; t.closeWhy=plainGroups(r.closeWhen); RUN.closed++; rlog('close',l,'Closed by the system · “'+t.title+'”',r.id+' · close when '+t.closeWhy); }
function runRules(kind,lines){
  var made=[], via= kind==='event' ? 'at once' : (kind+' check');
  lines.forEach(function(l){
    for(var pass=0; pass<10; pass++){
      var changed=false;
      S.data.rules.forEach(function(r){
        if(!ruleLive(r)) return;
        if(kind!=='event' && r.recheck!==kind) return;
        var rs=rtOf(l,r.id);
        if(hasConds(r.closeWhen) && evalGroups(r.closeWhen,l)){ openTasksOf(l,r.id).forEach(function(t){ closeBySystem(t,l,r); changed=true; }); }
        var cur= ruleFilters(r,l) && evalGroups(r.when,l);
        if(!cur){ rs.wasTrue=false; rs.since=0; rs.turnMade=false; return; }
        if(!rs.wasTrue){ rs.wasTrue=true; rs.since=S.now; rs.turnMade=false; }
        if(blockReason(r,l,rs)) return;
        if(hasConds(r.closeWhen) && evalGroups(r.closeWhen,l)) return; /* would close the moment it appears */
        var due=addWork(S.now,durMins(+r.du,r.duu)), escAt= r.cl==='sla' ? addWork(due,durMins(+r.ec,r.ecu)) : 0;
        var t={id:'T-'+(S.data.seq.task++),line:l.id,acct:null,owner:l.owner,title:r.ti,cls:r.cl==='sla'?'SLA':'Follow-up',createdAt:S.now,dueAt:due,escAt:escAt,done:0,doneAt:0,doneBy:'',rule:r.id,seen:'pending'};
        S.data.tasks.push(t); rs.turnMade=true; rs.count++; r.fd=(r.fd||0)+1; made.push(t); changed=true;
        rlog('make',l,'Task created · “'+r.ti+'”',r.id+' · '+via+' · for '+uname(l.owner)+' · due '+fmt(due)+(escAt?' · escalates '+fmt(escAt):' · never escalates'));
      });
      if(!changed) break;
    }
  });
  return made;
}
/* at seed time the lines already carry the tasks their rules made — mark those turns as made */
function primeRules(){ liveLines().forEach(function(l){ S.data.rules.forEach(function(r){ if(ruleFilters(r,l)&&evalGroups(r.when,l)){ var rs=rtOf(l,r.id); rs.wasTrue=true; rs.since=l.enteredAt||l.createdAt||S.now; rs.turnMade=true; rs.count=tasksOfLine(l.id).filter(function(t){return t.rule===r.id;}).length; } }); }); }
/* every event on a line ends here; the old (l,on,at) callers still work */
function fireRules(l){ return runRules('event',[l]); }
function liveLines(){ return S.data.lines.filter(function(l){ return !dead(l); }); }
function sweepStates(){
  S.data.tasks.forEach(function(t){ if(t.done) return; var s=taskStateOf(t); if(s!==(t.seen||'pending')){ var l=lineById(t.line);
    if(s==='over') rlog('esc',l,'Overdue · “'+t.title+'”','Shown to '+uname(t.owner)+' only');
    if(s==='esc'){ var u=userById(t.owner); rlog('esc',l,'Escalated · “'+t.title+'”','Now with '+uname(u&&u.mgr?u.mgr:'vikram')+', the owner’s manager'); }
    t.seen=s; } });
}
/* the prototype clock: every scheduled check between now and the target runs */
function advanceClock(target){
  var n={h:0,d:0,made:0}, guard=0; RUN.closed=0;
  while(guard++<3000){
    var th=nextCheck(S.now,'hourly'), td=nextCheck(S.now,'daily'), t=Math.min(th,td);
    if(t>target) break;
    S.now=t; sweepStates();
    if(td===t){ n.d++; n.made+=runRules('daily',liveLines()).length; }
    if(th===t){ n.h++; n.made+=runRules('hourly',liveLines()).length; }
  }
  if(target>S.now) S.now=target; sweepStates();
  n.ren=renSweep(true).length;
  rlog('time',null,'Clock moved to '+fmt(S.now), plural(n.h,'hourly check')+' and '+plural(n.d,'daily check')+' ran · '+n.made+' created · '+RUN.closed+' closed');
  return n;
}

/* ---------- sentences ---------- */
function dispLabel(v){ v=String(v); if(v==='group:nc') return 'any No connect'; if(v==='group:c') return 'any Connected'; return v; }
function condPlain(c){ var op=c.op==='isnot'?' is not ':' is ';
  if(c.type==='stage') return 'stage'+op+c.value+' · '+stageName(+c.value);
  if(c.type==='status') return 'status'+op+statusLabel(c.value);
  if(c.type==='disp') return 'latest call'+op+(String(c.value).indexOf('group:')===0?dispLabel(c.value):'“'+c.value+'”');
  return '“'+(c.task||'…')+'”'+op+tstateLabel(c.value); }
function condHtml(c){ var op=c.op==='isnot'?' is not ':' is ';
  if(c.type==='stage') return 'stage'+op+'<b>'+esc(c.value+' · '+stageName(+c.value))+'</b>';
  if(c.type==='status') return 'status'+op+'<b>'+esc(statusLabel(c.value))+'</b>';
  if(c.type==='disp') return 'latest call'+op+'<b>'+esc(dispLabel(c.value))+'</b>';
  return '<b>“'+esc(c.task||'…')+'”</b>'+op+'<b>'+esc(tstateLabel(c.value))+'</b>'; }
function liveGroups(gs){ return (gs||[]).filter(function(g){ return g.length; }); }
function plainGroups(gs){ var g=liveGroups(gs); return g.map(function(x){ var s=x.map(condPlain).join(' AND '); return g.length>1?'('+s+')':s; }).join(' OR '); }
function htmlGroups(gs){ var g=liveGroups(gs); if(!g.length) return '<span class="meta">no conditions yet</span>'; return g.map(function(x){ var s=x.map(condHtml).join(' and '); return g.length>1?'('+s+')':s; }).join(' <i>or</i> '); }
function ruleScope(r){ var p=[]; if(r.pf&&r.pf.length) p.push(r.pf.join(', ')); if(r.rt==='dau') p.push('DAU only'); if(r.rt==='plc') p.push('placement only'); if(r.ot==='ren') p.push('renewals'); if(r.ot==='new') p.push('new business'); if(r.ap==='ppl') p.push('owned by '+(r.pp||[]).map(uname).join(', ')); if(r.ap==='grp') p.push(r.gp); return p.join(' · '); }
function ruleSentence(r){
  var s='When '+htmlGroups(r.when);
  var sc=ruleScope(r); if(sc) s+=', only for <b>'+esc(sc)+'</b>';
  if(+r.waitN>0) s+=', wait <b>'+esc(durTx(+r.waitN,r.waitU))+'</b>, then'; else s+=',';
  s+=' create '+(r.cl==='sla'?'an <b>SLA</b>':'a <b>Follow-up</b>')+' task <b>“'+esc(r.ti||'…')+'”</b> for the line owner, due in <b>'+esc(durTx(+r.du||0,r.duu))+'</b>';
  s+= r.cl==='sla' ? ', escalating to their manager <b>'+esc(durTx(+r.ec||0,r.ecu))+'</b> after that.' : '. It stops at Overdue and never escalates.';
  s+=' Re-checked <b>'+(r.recheck==='off'?'never':r.recheck)+'</b>.';
  if(r.repeat) s+=' Repeats while the conditions stay true, '+(+r.max>0?'stopping after <b>'+esc(r.max)+'</b>.':'with <b>no maximum</b>.');
  s+= hasConds(r.closeWhen) ? ' Closes itself when '+htmlGroups(r.closeWhen)+'.' : ' Closed by hand.';
  var w=(r.from?'Active from '+esc(fmtD(new Date(r.from+'T00:00:00').getTime())):'')+(r.until?' until '+esc(fmtD(new Date(r.until+'T00:00:00').getTime())):'')+(r.sea?' · season: '+esc(r.sea):'');
  return s+(w?' <span class="meta">'+w+'</span>':'');
}

/* ---------- validation ---------- */
function ruleErrors(b,id){
  var e={};
  if(!(b.n||'').trim()) e.n='Name the rule.';
  if(!(b.ti||'').trim()) e.ti='The task needs a title — it is what the owner sees.';

/* ---------- the ticket: create, assign, move ---------- */

}
