function issWaiting(l){
  if(dead(l)||l.stage===14) return '—';
  if(l.stage===11||!l.iss) return 'Post-purchase';
  var r=l.iss.rows;
  if(l.stage===12){ if(r.pf.mode==='off'&&r.pf.st==='pending'&&r.pf.recv) return 'Us'; if(r.pf.st==='pending'||r.md.st==='pending') return 'Client'; if(r.rhl.st==='pending') return 'Insurer'; return 'Post-purchase'; }
  if(l.stage===13) return r.pol.st==='qc'?'Post-purchase':'Insurer';
  return 'Post-purchase';
}
function rowTx(k,r){
  if(k==='rhl'){ return r.st==='na'?'':(r.st==='wait'?'RHL starts at assignment':(r.st==='sent'?'RHL sent to client':'RHL pending on the insurer'+(r.fu?' · '+r.fu+' follow-ups':''))); }
  if(k==='pf'){ return r.st==='na'?'':(r.st==='wait'?'proposal form starts at assignment':(r.st==='done'?'proposal form completed':(r.recv?'filled form with the RM — upload it':'proposal form pending'+(r.fu?' · '+r.fu+' follow-ups':'')))); }
  if(k==='md'){ return r.st==='na'?(r.mode==='file'?'mandate on file':''):(r.st==='wait'?'mandate starts at assignment':(r.st==='done'?'mandate signed':'mandate pending'+(r.fu?' · '+r.fu+' follow-ups':''))); }
  if(k==='pol'){ return r.st==='na'?'':(r.st==='pending'?'policy copy pending on the insurer'+(r.fu||r.esc?' · '+r.fu+' follow-ups, '+r.esc+' escalations':''):(r.st==='qc'?'policy copy in QC':'policy copy sent')); }

}
function postRowsTx(l){ if(!l.iss) return ''; var r=l.iss.rows; return ['rhl','pf','md','pol'].map(function(k){return rowTx(k,r[k]);}).filter(Boolean).join(' · ')||ISS_STAGE[l.iss.stage]; }
function issTicket(l){

}

/* patch after a field edit, so the next click is not lost to a repaint: the field's change
   event fires on blur, i.e. on the mousedown of whatever the user clicks next. Buttons are
   updated in place (class, disabled, title) unless the set of buttons itself changed. */
function softPatch(el,html){
  var tmp=document.createElement('div'); tmp.innerHTML=html;
  var ob=el.querySelectorAll('button'), nb=tmp.querySelectorAll('button'), os=el.querySelectorAll('[data-soft]'), ns=tmp.querySelectorAll('[data-soft]');
  var sig=function(list){ return Array.prototype.map.call(list,function(b){ return (b.dataset.flow||'')+'|'+(b.dataset.uv||'')+'|'+(b.dataset.rfqact||'')+'|'+b.textContent; }).join('#'); };
  if(sig(ob)!==sig(nb)||os.length!==ns.length){ el.innerHTML=html; return; }
  Array.prototype.forEach.call(ob,function(b,i){ b.className=nb[i].className; b.disabled=nb[i].disabled; b.title=nb[i].title; b.hidden=nb[i].hidden; });
  Array.prototype.forEach.call(os,function(s,i){ if(s.innerHTML!==ns[i].innerHTML) s.innerHTML=ns[i].innerHTML; });
  var ot=el.firstElementChild, nt=tmp.firstElementChild; if(ot&&nt&&ot.className!==nt.className) ot.className=nt.className;
}
function rfqPatch(l){
  var f=document.getElementById('rfoot_'+l.id); if(f) softPatch(f,rfqFoot(l));
  var n=document.getElementById('nacard'); if(n) softPatch(n,naCard(l));
  cpPatch(l);
}
document.addEventListener('change',function(ev){
  var t=ev.target; if(!(t instanceof Element)) return; var k=t.dataset.rf, kc=t.dataset.rfc; if(k===undefined&&kc===undefined) return;
  var l=lineById(t.dataset.line); if(!l||!l.rfq) return; var client=kc!==undefined, key=client?kc:k, v=String(t.value||'').trim();
  if(!rfqEditable(l,client)) return;
  var cur=l.rfq.f[key]; if((cur?cur.v:'')===v) return;
  var ok=write(function(){ if(v) l.rfq.f[key]={v:v,by:client?'client':'owner',who:client?'':S.user,at:S.now}; else delete l.rfq.f[key]; },'the RFQ field');
  if(!ok){ var x=l.rfq.f[key]; t.value=x?x.v:''; return; }
  rfqPatch(l);
});

function rfqSwitch(l,why,detail){
  l.dauQcr=l.stage>=8?{v:l.round,q:(l.qsel&&l.qsel.length?l.qsel:QUOTES.dau.filter(function(q){return q.st==='quoted';}).map(function(q){return q.i;})),at:l.enteredAt,rejAt:S.now,why:detail||why}:null;
  l.rate=0; l.routeSwitch={why:why,at:S.now,detail:detail||''}; l.qsel=[]; l.round=1; l.picked=''; rfqOpen(l,acctOf(l),S.now);

/* ---------- seed: give every seeded non-DAU line the RFQ its stage implies ---------- */
function rfqSeedAll(lines,accounts){
  lines.forEach(function(l){
    if(l.rate!==0||l.stage<3){ l.rfq={st:'none',f:{},openedAt:0,sharedAt:0,verifiedAt:0,floatedAt:0,direct:0}; return; }
    var a=by(accounts,l.acct), t0=l.enteredAt||T0.getTime(), open=t0-86400000*(l.stage>6?9:2); /* later stages: the RFQ story sits well before the current stage */
    rfqOpen(l,a,open);
    var fs=rfqFlat(l,a), own=function(k){ var f=fs.filter(function(x){return x.k===k;})[0]; if(f&&f.s&&!rfqVal(l,k)) l.rfq.f[k]={v:f.s,by:'owner',who:l.owner,at:open+3600000}; };
    own('loc'); own('com'); own('lim'); own('fam'); own('wages');
    if(l.stage===3){ own('start'); return; }
    l.rfq.sharedAt=open+86400000;
    if(l.stage===4){ l.rfq.st='shared'; return; } /* the client has not touched it yet — the gaps are theirs */
    own('start');
    rfqFillRest(l,'client','',open+86400000*2-3600000,a);
    l.rfq.st='verified'; l.rfq.verifiedAt=l.stage===5?t0:open+86400000*2;
    if(l.stage>=6){ l.rfq.st='floated'; l.rfq.floatedAt=l.stage===6?t0:open+86400000*3; }
  });
}

/* ==================================================================== *
 *  The QCR — a report comparing the quotes, not a list of them.
 *  Placement builds it on a non-DAU line; on a DAU line it is assembled from
 *  the rater quotes the owner picked. The owner reviews it here and either
 *  sends it to the contact (7 → 8) or sends it back for revision (→ 6).
 *  The per-insurer terms below are prototype stand-ins.
 * ==================================================================== */
var QCR_TERMS={
 liab:{cov:'Premises, products and completed operations', add:['Defence costs outside the limit','Worldwide jurisdiction, excluding USA and Canada','Contractual liability'], exc:['Pollution, except sudden and accidental','Professional services','Product recall'], ded:['₹50,000 each claim','₹1,00,000 each claim','₹75,000 each claim']},
 marine:{cov:'All risks, warehouse to warehouse', add:['Strike, riot and civil commotion','War risk','Transit by courier'], exc:['Improper packing','Loss from delay','Inherent vice'], ded:['0.5% of claim, minimum ₹10,000','1% of claim, minimum ₹15,000','₹20,000 each claim']},
 prop:{cov:'Fire and special perils, STFI, earthquake', add:['Terrorism','Removal of debris','Architects’ and surveyors’ fees'], exc:['Wear and tear','Electrical and mechanical breakdown','Unoccupied beyond 30 days'], ded:['₹25,000 each claim','₹50,000 each claim','5% of claim, minimum ₹25,000']},
 gh:{cov:'Hospitalisation, day care, pre and post hospitalisation (30 / 60 days)', add:['Maternity up to ₹75,000','Pre-existing diseases from day one','Room rent at actuals'], exc:['Cosmetic treatment','Non-medical consumables','Experimental therapies'], ded:['No co-pay','10% co-pay on parents','5% co-pay on all claims']},
 wc:{cov:'Liability under the Employees’ Compensation Act', add:['Medical expenses up to ₹1,00,000','Occupational disease','Contractors’ workers'], exc:['Wilful misconduct','War and nuclear','Intoxication'], ded:['None','None','None']}
};
var QCR_CSR={'New India Assurance':'95.6%','Oriental Insurance':'93.1%','United India':'92.4%','Reliance General':'94.0%','ICICI Lombard':'96.8%','Tata AIG':'95.2%','Bajaj Allianz':'94.4%','HDFC Ergo':'96.1%'};

function qcrSource(l){ return l.rate===1?'dau':'plc'; }
function qcrQuotes(l,dauRejected){
  if(dauRejected&&l.dauQcr) return QUOTES.dau.filter(function(q){ return l.dauQcr.q.indexOf(q.i)>=0; });
  if(l.rate===1){ var sel=l.qsel&&l.qsel.length?l.qsel:null; return QUOTES.dau.filter(function(q){ return q.st==='quoted'&&(!sel||sel.indexOf(q.i)>=0); }); }
  return QUOTES.plc.filter(function(q){ return q.st==='quoted'; });
}
function qcrOthers(l,dauRejected){ if(dauRejected||l.rate===1) return []; return QUOTES.plc.filter(function(q){ return q.st!=='quoted'; }); }
function qcrIssued(l,v){ var e=l.log.filter(function(x){ return /Quotes returned by placement|QCR v\d+ (sent to|shared with) client/.test(x.t); }).sort(function(a,b){return a.at-b.at;}); return e.length?e[e.length-1].at:(l.enteredAt||S.now); }

function qcrReport(l,v,dauRejected){
  var a=acctOf(l), r=l.req||{}, qs=qcrQuotes(l,dauRejected), oth=qcrOthers(l,dauRejected), fam=RFQ_FAM[l.product]||'prop', T=QCR_TERMS[fam];
  var issued=qcrIssued(l,v), dau=dauRejected||l.rate===1;
  var by_=dau?uname(l.owner)+', BimaKavach':'Meera Iyer, BimaPlacement', ref=dau?'QCR-'+l.id.slice(3)+'-'+v:'PLC-'+l.id.slice(3);
  var col=function(fn){ return qs.map(function(q,i){ return '<td>'+fn(q,i)+'</td>'; }).join(''); };
  var rows=[
    ['Premium', function(q){ return '<b class="qs-p">'+INR(q.p)+'</b>'; }],
    ['Sum insured', function(){ return esc(r.si||'—'); }],
    ['Scope of cover', function(){ return esc(T.cov); }],
    ['Deductible', function(q,i){ return esc(T.ded[i%3]); }],
    ['Add-ons included', function(q,i){ return T.add.slice(0,3-(i%3)).map(esc).join('<br>'); }],
    ['Exclusions to note', function(q,i){ return esc(T.exc[i%3]); }],
    ['Claim settlement ratio', function(q){ return esc(QCR_CSR[q.i]||'—'); }],
    ['Quote valid until', function(){ return esc(fmtD(issued+30*86400000)); }]
  ];
  return '<article class="qsheet">'+
    '<header class="qs-h"><div class="qs-brand">Bima<i>Kavach</i></div><div class="qs-tt"><div class="qs-title">Quote Comparison Report</div><div class="qs-ver">Version '+v+' · '+esc(fmtD(issued))+'</div></div></header>'+
    '<dl class="qs-meta">'+
      '<div><dt>Prepared for</dt><dd>'+esc(a.n)+'</dd></div>'+
      '<div><dt>Product</dt><dd>'+esc(l.product)+'</dd></div>'+
      '<div><dt>Sum insured</dt><dd>'+esc(r.si||'—')+'</dd></div>'+
      '<div><dt>Policy period</dt><dd>'+esc(r.ten||'1 year')+(l.rfq&&l.rfq.f&&rfqVal(l,'start')?' from '+esc(fmtD(new Date(rfqVal(l,'start')+'T00:00:00').getTime())):'')+'</dd></div>'+
      '<div><dt>Prepared by</dt><dd>'+esc(by_)+'</dd></div>'+
      '<div><dt>Reference</dt><dd>'+esc(ref)+'</dd></div>'+
    '</dl>'+
    '<div class="qs-tw"><table class="qs-t"><thead><tr><th></th>'+qs.map(function(q){ return '<th>'+esc(q.i)+'</th>'; }).join('')+'</tr></thead><tbody>'+
      rows.map(function(rw){ return '<tr><th>'+esc(rw[0])+'</th>'+col(rw[1])+'</tr>'; }).join('')+'</tbody></table></div>'+
    (oth.length?'<div class="qs-also"><b>Also approached</b>'+oth.map(function(q){ return '<span>'+esc(q.i)+' — '+(q.st==='declined'?'declined'+(q.r?': '+esc(q.r.toLowerCase()):''):'no response by the report date')+'</span>'; }).join('')+'</div>':'')+
    '<footer class="qs-note">This report sets out the quotes as received and names no preferred insurer. Terms are summarised; the insurer’s policy wording governs.</footer>'+
  '</article>';
}

HANDLERS.push(function(t){
  var x;
  if(x=t.closest('[data-flow="qcrPlc"]')){ var lp=lineById(x.dataset.line); if(lp) qvOpen(lp,lp.round); return true; } /* ticket rows still name the old flow */

/* ==================================================================== *
 *  Payment — the mode chosen at the request is carried through, shown
 *  plainly before the details go to the client, and the proof is a
 *  payment screenshot the amount (and UTR) are read from. If they cannot
 *  be read, the owner types them.
 * ==================================================================== */
function payModeOf(l){ return l.payMode||'Payment link'; }
function payInsurer(l){ return l.picked||l.ins||'the insurer'; }
function payDetails(l){
  var m=payModeOf(l), ins=payInsurer(l), slug=ins.toLowerCase().replace(/[^a-z]+/g,''), amt=INR(l.amt||premOf(l));
  if(m==='NEFT / RTGS') return [['Beneficiary',esc(ins)],['Account number','<span class="mono">XXXX XXXX '+esc(l.id.slice(3))+'</span>'],['IFSC','<span class="mono">'+esc(slug.slice(0,4).toUpperCase())+'0000104</span>'],['Reference to quote','<span class="mono">'+esc('Q-'+l.id.slice(3)+'-26')+'</span>'],['Amount','<b>'+amt+'</b>']];
  if(m==='Cheque') return [['Payable to',esc(ins)],['Hand over at',esc(ins)+' branch, or the BimaKavach office'],['Write on the back','<span class="mono">'+esc('Q-'+l.id.slice(3)+'-26')+'</span> and the client’s phone number'],['Amount','<b>'+amt+'</b>']];
  if(m==='Proforma invoice') return [['Proforma invoice','PDF · issued by '+esc(ins)],['Pay by',esc(fmtD(addWork(S.now,durMins(3,'d'))))],['Amount','<b>'+amt+'</b>']];
  return [['Payment link','<span class="mono">pay.'+esc(slug)+'.com/…</span>'],['Valid for','48 hours'],['Amount','<b>'+amt+'</b>']];
}
function payModeBlock(l){
  return '<div class="paymode"><div class="pm-k">Payment mode</div><div class="pm-v">'+esc(payModeOf(l))+'</div></div>'+
    '<div class="kvgrid two mt12">'+payDetails(l).map(function(r){ return kv(r[0],r[1]); }).join('')+'</div>';
}

/* ==================================================================== *
 *  Renewals — decided 22 Sep 2026.
 *  · The system opens a renewal product line 90 days before a policy on an
 *    RM's account expires: its own renewal opportunity, owned by the
 *    account's RM, linked to the expiring policy (l.renews = policy id).
 *  · It starts at Details Captured. The requirement is carried over from the
 *    expiring policy.
 *  · [stated 24 Sep] THERE IS NO DAU ROUTE AT RENEWAL. Every renewal is an RFQ
 *    line and goes to placement, whatever the product and whatever the fresh
 *    buy was. Three ways the RFQ opens:
 *      – the fresh buy was Non-DAU and bought here → last year's RFQ is
 *        carried over, for the RM to change and send on;
 *      – the fresh buy was DAU, so no RFQ was ever raised → a new RFQ opens,
 *        pre-filled from the policy and the account, for the RM to fill;
 *      – the policy was not bought through the CRM → the same, pre-filled
 *        from the policy record.
 *  · [stated 24 Sep] contractual policies never renew — Workmen's
 *    Compensation, Contractors All Risk and Erection All Risk. No renewal line
 *    is opened and they are out of every renewal view.
 *  · The Renewals pipeline (RMs only) groups the lines by when the current
 *    policy expires: Overdue · Due today · 1–7 · 8–30 · 31–60 · 61–90 days.
 * ==================================================================== */
var REN_WINDOW=90;
var REN_BANDS=[
  {k:'over', t:'Overdue',     g:'expired, not renewed',  tone:'red'},
  {k:'today',t:'Due today',   g:'expires today',         tone:'red'},
  {k:'d7',   t:'1–7 days',    g:'expires this week',     tone:'amber'},
  {k:'d30',  t:'8–30 days',   g:'expires this month',    tone:'amber'},
  {k:'d60',  t:'31–60 days',  g:'expires in 1–2 months', tone:'blue'},
  {k:'d90',  t:'61–90 days',  g:'expires in 2–3 months', tone:'neutral'}
];
function dayStart(t){ var d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); }
function calDays(a,b){ return Math.round((dayStart(b)-dayStart(a))/86400000); }
function polHit(accounts,pid){ for(var i=0;i<accounts.length;i++){ var a=accounts[i]; for(var j=0;j<(a.pols||[]).length;j++){ if(a.pols[j].id===pid) return {a:a,p:a.pols[j]}; } } return null; }
function renPolHit(l){ return l&&l.renews?polHit(S.data.accounts,l.renews):null; }
function renDays(l){ var h=renPolHit(l); return h?calDays(S.now,h.p.exp):0; }
function renBandKey(d){ return d<0?'over':(d===0?'today':(d<=7?'d7':(d<=30?'d30':(d<=60?'d60':'d90')))); }
function renBand(k){ return REN_BANDS.filter(function(b){return b.k===k;})[0]; }
function renInTx(d){ return d<0?'expired '+plural(-d,'day')+' ago':(d===0?'expires today':(d===1?'expires tomorrow':'expires in '+d+' days')); }
function renLineOf(pid){ return S.data.lines.filter(function(l){ return l.renews===pid; })[0]||null; }
function renLines(uid){ return S.data.lines.filter(function(l){ return l.renews&&(!uid||l.owner===uid); }); }
function renDue(l){ return !dead(l)&&l.stage<SALES_STAGES; }                  /* still to renew */
function renCancelled(p){ return (S.data&&S.data.svc||[]).some(function(t){ return t.k==='end'&&t.pol===p.id&&t.sub==='Cancellation and refund'&&t.stage==='Completed'; }); }

/* ---------- the route at renewal — [stated 24 Sep] there isn't one to decide.
   Every renewal is an RFQ line. The rater never prices a renewal, whatever the product and
   whatever the sum insured, so the v21 DAU re-check at Details Captured is gone with it. ---------- */
function siRupees(s){ var m=String(s||'').replace(/,/g,'').match(/([\d.]+)\s*(cr|crore|l|lakh|lac|k)?/i); if(!m) return NaN; var n=parseFloat(m[1]), u=(m[2]||'').toLowerCase(); return n*(u==='cr'||u==='crore'?1e7:(u==='l'||u==='lakh'||u==='lac'?1e5:(u==='k'?1e3:1))); }
function renIsDau(){ return false; }
/* where a renewal's RFQ came from — it decides what the RM is being asked to do */
function renRfqSrc(l){ return (l&&l.rfq&&l.rfq.src)||'outside'; }

/* renewal opportunity name — [stated] 22 Sep: Productline_Renewal_Month Year, the month the policy expires */
function renOppName(p){ var d=new Date(p.exp); return p.p+'_Renewal_'+MONN[d.getMonth()]+' '+d.getFullYear(); }

/* ---------- what is carried over ---------- */
function renReq(a,p,orig){
  var r=orig&&orig.req?orig.req:{};
  return {si:p.si, tp:INR(p.pr), to:(r.to&&r.to!=='—')?r.to:(a.to||'—'), tob:r.tob||'Manufacturing', noc:r.noc||'Private limited',
    pol:'y', ins:p.ins, exp:ymd(p.exp), ten:r.ten||'1 year', clm:r.clm||'No claims in 3 years', pan:'', note:'Carried over from '+p.id};
}
/* [stated 24 Sep] three ways the renewal's RFQ opens, and the RM is asked something different
   in each: carried over from last year's RFQ · a new RFQ because the fresh buy was DAU and
   never had one · a new RFQ because the policy was never bought through the CRM. */
function renRfq(l,a,p,orig,at){
  var fs=rfqFlat(l,a), carried=orig&&orig.rfq&&orig.rfq.f&&Object.keys(orig.rfq.f).length;
  l.rfq={st:'draft',f:{},openedAt:at,sharedAt:0,verifiedAt:0,floatedAt:0,direct:0,from:'',src:''};
  if(carried){
    l.rfq.from=orig.id; l.rfq.src='carry';
    fs.forEach(function(f){ var x=orig.rfq.f[f.k]; if(x&&x.v) l.rfq.f[f.k]={v:x.v,by:'carry',who:orig.id,at:at}; });
  } else {
    l.rfq.src=orig?'dau':'outside';   /* a fresh line with no RFQ was priced by the rater */
    fs.forEach(function(f){ if(f.pre) l.rfq.f[f.k]={v:f.pre,by:f.by,who:'',at:at}; });
  }
  /* what a year changes: the insured's name, the current insurer, its expiry and the new start date */
  var set=function(k,v){ if(v) l.rfq.f[k]={v:v,by:'req',who:'',at:at}; };
  set('name',a.n); set('si',(l.req&&l.req.si)||p.si); set('ins',p.ins); set('exp',ymd(p.exp)); set('start',ymd(p.exp+86400000));
}
function renRfqWhy(l){
  var src=renRfqSrc(l), h=renPolHit(l), pid=h?h.p.id:(l.renews||'the policy');
  if(src==='carry') return 'Carried over from <button class="link" data-go="line" data-id="'+esc(l.rfq.from)+'">'+esc(l.rfq.from)+'</button>, the RFQ placement received when the policy was bought. The insurer, expiry and start date are updated for this year. Change anything that has changed, then send it on.';
  if(src==='dau') return '<b>There is no RFQ to carry over.</b> '+esc(pid)+' was priced by the rater at the fresh buy, so one was never raised. A renewal always goes to placement, so the RFQ opens here pre-filled from the policy and the account — the rest is yours to fill.';
  return 'Pre-filled from the expiring policy '+esc(pid)+' and the account — it was not bought through the CRM, so the rest is to fill. A renewal always goes to placement.';
}
function renRfqNote(l){ if(!renPolHit(l)) return '';
  return '<div class="rnote">'+ic('refresh','ic14')+'<span>'+renRfqWhy(l)+'</span></div>';
}
function renRfqLogT(l,p){ var s=renRfqSrc(l);
  return s==='carry'?('RFQ carried over from '+l.rfq.from)
    :(s==='dau'?('RFQ opened — '+(p?p.id:l.renews)+' was DAU at the fresh buy, so there was none to carry over')
              :('RFQ pre-filled from '+(p?p.id:l.renews))); }
function renRfqLogM(l){ var s=renRfqSrc(l);
  return s==='carry'?'System · the insurer, expiry and start date updated for this year'
    :(s==='dau'?'System · a renewal always goes to placement · pre-filled from the policy and the account'
              :'System · not bought through the CRM · pre-filled from the policy record'); }

/* ---------- seed: the renewal lines the system opened before the seed clock ---------- */
function renSeedFix(lines,accounts,opps,users){
  var uname=function(id){ var u=users.filter(function(x){return x.id===id;})[0]; return u?u.n:id; };
  var byId=function(id){ return lines.filter(function(x){return x.id===id;})[0]; };
  lines.forEach(function(l){
    if(!l.renews) return; var h=polHit(accounts,l.renews); if(!h) return; var a=h.a, p=h.p, at=l.createdAt;
    var orig=p.line?byId(p.line):null;
    if(orig&&!orig.paidAt){ orig.soldBy='anand'; orig.paidAt=orig.enteredAt-19*86400000; orig.log.push({at:orig.paidAt,t:'Payment confirmed',m:'Anand Kulkarni · '+INR(orig.prem)+' matched',sys:0,kind:'pay'},{at:orig.enteredAt,t:'Policy copy and tax invoice sent to the client',m:'System · '+p.id,sys:1,kind:'post'}); }
    /* [stated 24 Sep] a renewal is never DAU — every seeded renewal line is an RFQ line */
    l.req=renReq(a,p,orig); l.prem=p.pr; l.src='Renewal route'; l.rate=0;
    var d=calDays(at,p.exp);
    l.log=[{at:at,t:'Renewal line created',m:'System · '+p.id+' expires '+fmtD(p.exp)+' · opened '+d+' days out · owned by the account’s RM · requirement carried over',sys:1,kind:'sys'},
           {at:at,t:'Stage entered: '+stageName(3),m:'System · a renewal starts here, on the RFQ route',sys:1,kind:'stage'}];
    {
      renRfq(l,a,p,orig,at);
      l.log.push({at:at,t:renRfqLogT(l,p),m:renRfqLogM(l),sys:1,kind:'rfq'});
      if(l.stage>=4){ l.rfq.sharedAt=at+86400000*4; l.log.push({at:l.rfq.sharedAt,t:'RFQ emailed to '+(l.contact.n||'the client')+' for review',m:uname(l.owner),sys:0,kind:'email'});
        if(l.stage>=5){ rfqFillRest(l,'client','',at+86400000*6,a); l.rfq.st='verified'; l.rfq.verifiedAt=at+86400000*6; l.log.push({at:l.rfq.verifiedAt,t:'Client approved the RFQ',m:(l.contact.n||'Client')+' · no changes this year',sys:1,kind:'rfq'}); }
        else l.rfq.st='shared';
        if(l.stage>=6){ l.rfq.st='floated'; l.rfq.floatedAt=at+86400000*7; l.log.push({at:l.rfq.floatedAt,t:'RFQ floated to placement',m:uname(l.owner)+' · ticket PLC-'+l.id.slice(3)+' raised · after client review',sys:0,kind:'sys'}); l.qAns=1; }
        if(l.stage>=7) l.log.push({at:l.enteredAt,t:'Quotes returned by placement',m:'System · ticket PLC-'+l.id.slice(3),sys:1,kind:'sys'});
      }
      /* a seeded renewal already past Quote Sent needs its RFQ to have gone out and come back */
      if(l.stage>=8&&l.rfq.st!=='floated'){ rfqFillRest(l,'client','',at+86400000*5,a); l.rfq.st='floated'; l.rfq.sharedAt=l.rfq.sharedAt||at+86400000*3; l.rfq.verifiedAt=at+86400000*5; l.rfq.floatedAt=at+86400000*6; l.qAns=1; }
    }
    if(l.stage>=8){ l.log.push({at:l.stage===8?l.enteredAt:l.enteredAt-86400000*5,t:'QCR v1 sent to client',m:uname(l.owner)+' · from placement · renewal',sys:0,kind:'qcr'}); }
    if(l.stage>=9){ l.log.push({at:l.enteredAt,t:'Client confirmed insurer',m:uname(l.owner)+' · '+l.picked,sys:0,kind:'call'}); }
    if(l.stage>=9&&l.pay==='ticket'){ l.payLines=[l.id]; l.amt=premOf(l); l.log.push({at:l.enteredAt+3600000,t:'Payment ticket PAY-'+l.id.slice(3)+' raised',m:'System · covers 1 product line · '+(l.payMode||'NEFT / RTGS'),sys:1,kind:'sys'}); }
    if(l.stage>3) l.log.push({at:l.enteredAt,t:'Stage entered: '+stageName(l.stage),m:'System',sys:1,kind:'stage'});
  });
}

/* ---------- the system opening renewal lines as the clock moves ---------- */
function renCreate(a,p,at){
  var orig=p.line?lineById(p.line):null, ou=userById(a.own), owner=ou&&ou.role==='rm'?a.own:rmFor(a), c=a.con.filter(function(x){return !x.dep;})[0]||a.con[0]||{n:'',e:'',m:''};
  /* [stated 23 Sep] no opportunity is created — the renewal is a product line on the account */
  var l={id:'OP-'+(S.data.seq.line++),opp:'',acct:a.id,product:p.p,owner:owner,stage:3,status:'open',reason:'',revisit:0,att:0,rate:0,rfq:{st:'none',f:{}},
    req:renReq(a,p,orig),round:1,qAns:0,obj:'',qsel:[],picked:'',prem:p.pr,ins:'',pay:'pre',payMode:'',amt:0,payLines:[],renews:p.id,
    enteredAt:at,createdAt:at,assignedAt:at,src:'Renewal route',contact:{n:c.n||'',e:c.e||'',m:c.m||''},log:[]};
  l.rate=0;   /* [stated 24 Sep] no DAU route at renewal */
  l.log.unshift({at:at,t:'Renewal line created',m:'System · '+p.id+' expires '+fmtD(p.exp)+' · '+REN_WINDOW+'-day window · owned by '+uname(owner)+' · requirement carried over · RFQ route',sys:1,kind:'sys'});
  renRfq(l,a,p,orig,at); l.log.unshift({at:at,t:renRfqLogT(l,p),m:renRfqLogM(l),sys:1,kind:'rfq'});
  S.data.lines.push(l);
  return l;
}
function renSweep(fire){
  var made=[];
  S.data.accounts.forEach(function(a){ (a.pols||[]).forEach(function(p){
    /* [stated 24 Sep] a contractual policy never renews — it runs for the length of a contract */
    if(p.issuing||renCancelled(p)||isContractual(p.p)) return;
    var d=calDays(S.now,p.exp); if(d<0||d>REN_WINDOW) return;
    if(renLineOf(p.id)) return;
    var l=renCreate(a,p,S.now); made.push(l); if(fire) fireRules(l);
  }); });
  return made;
}

/* ---------- on the line ---------- */
function renHeadChip(l){ var d=renDays(l), h=renPolHit(l); if(!h) return ''; var b=renBand(renBandKey(d));
  return chip('Renewal · '+(d<0?'expired '+fmtDs(h.p.exp):'expires '+fmtDs(h.p.exp)),renDue(l)?b.tone:'neutral',false,true); }
function renOverview(l){ var h=renPolHit(l); if(!h) return ''; var p=h.p;

/* ==================================================================== *
 *  Policies — how a policy is typed, and Policy 360
 *  [stated 23 Sep] Fresh = the first policy booked on the account.
 *  Cross-sell = every policy after that. Renewal = a policy produced by
 *  renewing an earlier one. The type is written once and never changes.
 * ==================================================================== */
var PTYPE={Fresh:'violet','Cross-sell':'blue',Renewal:'green'};
var PTYPES=['Fresh','Cross-sell','Renewal'];

/* [stated 24 Sep · TBD-34] a policy carries two numbers.
   · BK_internal_policy_number — generated by us when the policy record is written. A migrated
     policy has one if it had one; otherwise it stays empty.
   · Policy number — the insurer's, read off the policy copy. Empty until the copy arrives.
   p.id stays the CRM's own record key, and is never shown as either number. */
var BKPOL_SEQ=4200;   /* advanced by the seed pass, then carried on S.data.seq.bkpol */
function bkPolNo(){ var n;
  if(S.data&&S.data.seq){ n=(S.data.seq.bkpol||BKPOL_SEQ)+1; S.data.seq.bkpol=n; }
  else { n=++BKPOL_SEQ; }
  return 'BK/2026/'+n; }
function insPolNo(p){ return String(p.id); }
function polBk(p){ return p.bkno||''; }
function polNo(p){ return p.pno||''; }
function polNoCell(p){ return p.pno?'<span class="mono">'+esc(p.pno)+'</span>':'<span class="meta">awaited</span>'; }
function polStart(p){ return p.start||(p.exp?p.exp-364*86400000:0); }
function polType(p){ return p.ptype||'Fresh'; }
function polActive(p){ return !(p.expired||p.exp<S.now); }
function polLive(p){ return {tx:polActive(p)?'Active':'Inactive', tone:polActive(p)?'green':'neutral'}; }
function polById(pid){ for(var i=0;i<S.data.accounts.length;i++){ var a=S.data.accounts[i]; for(var j=0;j<(a.pols||[]).length;j++) if(a.pols[j].id===pid) return {a:a,p:a.pols[j]}; } return null; }
function polPrev(p){ return p.prev?polById(p.prev):null; }
function polNext(p){ var h=null; S.data.accounts.forEach(function(a){ (a.pols||[]).forEach(function(x){ if(x.prev===p.id) h={a:a,p:x}; }); }); return h; }
function polLine(p){ return p.line?lineById(p.line):null; }
function polSvc(p){ return S.data.svc.filter(function(t){return t.pol===p.id;}); }

/* the type a policy gets when it is booked, decided once */
function polTypeFor(a,l){
  if(l&&l.renews) return 'Renewal';
  return (a.pols||[]).filter(function(p){return !p.issuing;}).length?'Cross-sell':'Fresh';
}
/* seed pass: give every policy a start date, a type, and its two numbers, oldest first */
function polSeedFix(accounts){
  accounts.forEach(function(a){
    var ps=(a.pols||[]).slice().sort(function(x,y){ return polStart(x)-polStart(y); });
    var seenFresh=false;
    ps.forEach(function(p){
      if(!p.start) p.start=polStart(p);
      /* [stated 24 Sep · TBD-34] the insurer's number is on every issued policy; the BK internal
         number exists for the ones sold through the CRM, and for the migrated ones that had one. */
      if(p.pno===undefined) p.pno=p.issuing?'':p.id;
      if(p.bkno===undefined) p.bkno=(p.line||/-202[56]-/.test(p.id))?bkPolNo():'';
      if(p.ptype) { if(p.ptype!=='Renewal') seenFresh=true; return; }
      if(p.prev){ p.ptype='Renewal'; return; }
      p.ptype=seenFresh?'Cross-sell':'Fresh'; seenFresh=true;
    });
  });
}

/* ---------- Policy 360 ---------- */
/* [stated 23 Sep] a policy still being issued is Active. What is not there yet is the policy copy,
   and that is said in Documents — each document reads Available or Pending, with who it sits with. */
function polDocs(p){
  var l=polLine(p), r=l&&l.iss?l.iss.rows:null, issued=!p.issuing, out=[];
  var row=function(n,have,who){ return {n:n, have:!!have, who:who||''}; };
  out.push(row('Policy copy', issued, 'with the insurer — the desk is chasing it'));

  out.push(row('Mandate letter', r?(r.md.st==='done'||r.md.mode==='file'):1, 'with the client'));
  out.push(row('PAN card',1)); out.push(row('GST certificate',1));
  return out;
}

/* ============================================================================
   Click to call — [stated 23 Sep 2026]
   The RM presses Call on the product line, the system places it, and the moment
   the call ends the disposition form opens on its own. Logging a call by hand
   opens the same form. The telephony is simulated the way every other external
   event in this prototype is: the switch's answers are the amber-dashed buttons.
   [stated] the outcome is not optional — once a call has been placed the
   disposition modal cannot be dismissed until an outcome is picked.
   [stated] nothing is pre-selected. The switch knows whether it connected; only
   the RM knows what was said.
   ========================================================================== */
var CTC={tm:null, iv:null, at:null, res:null};

function ctcStop(){ if(CTC.tm){ clearTimeout(CTC.tm); CTC.tm=null; } if(CTC.iv){ clearInterval(CTC.iv); CTC.iv=null; } }
function ctcReset(){ ctcStop(); CTC.at=null; }
function ctcSecs(t0){ return t0?Math.max(0,Math.round((Date.now()-t0)/1000)):0; }
function mmss(s){ var m=Math.floor(s/60), r=s%60; return (m<10?'0':'')+m+':'+(r<10?'0':'')+r; }
function durTx(s){ if(s<60) return s+' sec'; var m=Math.floor(s/60), r=s%60; return m+' min'+(r?' '+r+' sec':''); }

/* the four things the switch can come back with */
var CTC_END={
  done:{lab:'Connected',    tone:'green', con:1},
  noans:{lab:'No answer',   tone:'amber', con:0},
  busy:{lab:'Busy',         tone:'amber', con:0},
  off:{lab:'Switched off or unreachable', tone:'amber', con:0}
};
function ctcEndKey(ph){ return ph&&ph.indexOf('e_')===0?ph.slice(2):''; }

/* the line's own contact is who gets dialled — it is the decision maker the
   line already carries, and 'Wrong person, referred to correct POC' is what
   changes it. */
function ctcWho(l){ var c=(l&&l.contact)||{}; return {n:c.n||'the client', m:c.m||'—'}; }

FLOWS.ctc={
  t:function(){ var l=FL(); return l&&l.stage===1?'First contact':'Call'; },
  sub:function(){ var k=ctcEndKey(S.sel.ph); return k?'The call is over. The outcome form opens next — it has to be logged.':'The system is placing the call. When it ends you log the outcome.'; },
  nofoot:function(){ return true; },
  locked:function(){ return S.sel.ph==='live'||!!ctcEndKey(S.sel.ph); },
  body:function(){
    var l=FL(), w=ctcWho(l), ph=S.sel.ph||'dial';
    if(!S.sel.ph) S.sel.ph='dial';

    /* entering a phase — wind the clocks exactly once, never on a repaint */
    if(ph!==CTC.at){
      ctcStop(); CTC.at=ph;
      if(ph==='dial'){ CTC.tm=setTimeout(function(){ if(S.flow==='ctc'&&S.sel.ph==='dial'){ S.sel.ph='ring'; paintModal(); } },1500); }
      if(ph==='ring'){ S.sel.r0=Date.now(); }
      if(ph==='live'){ S.sel.t0=Date.now();
        CTC.iv=setInterval(function(){ if(S.flow!=='ctc'||S.sel.ph!=='live'){ ctcStop(); return; }
          var n=document.getElementById('ctcT'); if(n) n.textContent=mmss(ctcSecs(S.sel.t0)); },1000); }
      if(ctcEndKey(ph)){
        var k=ctcEndKey(ph);
        CTC.res={k:k, con:CTC_END[k].con, dur:k==='done'?ctcSecs(S.sel.t0):0, rang:ctcSecs(S.sel.r0), who:w.n, num:w.m, at:S.now};
        CTC.tm=setTimeout(function(){ var ln=FL(); if(S.flow==='ctc'&&ln) openFlow('call',{line:ln.id, ctc:CTC.res}); },900);
      }
    }

    var head='<div class="ctcwho">'+avatar(w.n)+'<div><div class="n">'+esc(w.n)+'</div><div class="m mono">'+esc(w.m)+'</div></div></div>';

    var give='<div class="ctcact"><button class="btn sm ghost" data-close="1">Cancel the call</button></div>';

    if(ph==='dial') return '<div class="ctc">'+head+

/* ==================================================================== *
 *  Documents — one viewer for every document in the system.
 *  [stated 24 Sep] wherever a document is shown, it can be viewed and
 *  downloaded: quote, QCR, RFQ, policy copy, tax invoice, PAN, GST,
 *  Aadhaar, mandate letter, proposal form, RHL, payment proof.
 *
 *  A document is opened with data-doc="<name>" and, optionally, the record
 *  it hangs off — data-dacct, data-dpol, data-dline, data-dref, data-dv.
 *  Nothing here stores anything: every sheet is rendered from the record.
 * ==================================================================== */

/* ---------- which document is this ---------- */
function docKind(n){
  var s=String(n||'').toLowerCase();
  if(/pan/.test(s)) return 'pan';
  if(/gst.*(cert|reg)|gst certificate|gstin/.test(s)) return 'gst';
  if(/aadhaar|aadhar/.test(s)) return 'aadhaar';
  if(/mandate/.test(s)) return 'mandate';
  if(/proposal/.test(s)) return 'proposal';
  if(/risk-held|risk held|\brhl\b/.test(s)) return 'rhl';
  if(/tax invoice|invoice/.test(s)) return 'invoice';
  if(/policy copy|policy schedule|^policy\b/.test(s)) return 'policy';
  if(/quote comparison|\bqcr\b/.test(s)) return 'qcr';
  if(/quote/.test(s)) return 'quote';
  if(/\brfq\b|request for quote/.test(s)) return 'rfq';
  if(/payment proof|screenshot/.test(s)) return 'proof';
  return 'generic';
}
var DOCEXT={pan:'pdf',gst:'pdf',aadhaar:'pdf',mandate:'pdf',proposal:'pdf',rhl:'pdf',invoice:'pdf',policy:'pdf',qcr:'pdf',quote:'pdf',rfq:'pdf',proof:'png',generic:'pdf'};
var DOCSIZE={pan:'210 KB',gst:'480 KB',aadhaar:'190 KB',mandate:'320 KB',proposal:'1.4 MB',rhl:'260 KB',invoice:'88 KB',policy:'2.1 MB',qcr:'640 KB',quote:'410 KB',rfq:'300 KB',proof:'742 KB',generic:'256 KB'};

/* ---------- the record a document hangs off ---------- */
function docCtx(ds){
  var c={name:ds.doc||'Document', v:+(ds.dv||0)};
  c.line=ds.dline?lineById(ds.dline):null;
  c.polh=ds.dpol?polById(ds.dpol):null;
  c.pol=c.polh?c.polh.p:null;
  c.acct=ds.dacct?by(S.data.accounts,ds.dacct):(c.polh?c.polh.a:(c.line?acctOf(c.line):null));
  c.ref=ds.dref||'';
  if(!c.pol&&c.line) { var h=(c.acct&&c.acct.pols||[]).filter(function(p){return p.line===c.line.id;})[0]; if(h) c.pol=h; }
  return c;
}
function docShort(c){ return shortName((c.acct&&c.acct.n)||'BimaKavach').replace(/[^A-Za-z0-9]+/g,''); }
function docFile(k,c){
  var base={pan:'PAN_'+docShort(c),gst:'GST_Certificate_'+docShort(c),aadhaar:'Aadhaar_'+docShort(c),
    mandate:'Mandate_'+docShort(c)+(c.ref?'_'+c.ref:''),proposal:'ProposalForm_'+docShort(c),rhl:'RHL_'+docShort(c),
    invoice:'TaxInvoice_'+docShort(c),policy:'Policy_'+((c.pol&&c.pol.id)||docShort(c)),
    qcr:'QCR_v'+(c.v||1)+'_'+docShort(c),quote:'Quote_'+docShort(c),rfq:'RFQ_'+docShort(c),
    proof:'payment-screenshot',generic:String(c.name).replace(/[^A-Za-z0-9]+/g,'_')}[k];

function pdfTxt(s){
  return String(s==null?'':s)
    .replace(/₹/g,'Rs ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"')
    .replace(/[–—]/g,'-').replace(/·/g,'-').replace(/•/g,'*').replace(/…/g,'...')
    .replace(/[^\x20-\x7e]/g,'');
}
function pdfEsc(s){ return pdfTxt(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }
function pdfWrap(s,n){ var w=pdfTxt(s).split(/\s+/), out=[], cur='';
  w.forEach(function(x){ if(!cur) cur=x; else if((cur+' '+x).length<=n) cur+=' '+x; else { out.push(cur); cur=x; } });
  if(cur) out.push(cur); return out.length?out:['']; }
function docLines(k,c){
  var tmp=document.createElement("div"); tmp.innerHTML=docSheet(k,c);
  Array.prototype.forEach.call(tmp.querySelectorAll('br'),function(br){ br.parentNode.replaceChild(document.createTextNode(' / '),br); });
  var lines=[], INLINE={B:1,I:1,EM:1,STRONG:1,SPAN:1,A:1,BUTTON:1,SMALL:1,CODE:1,DT:1,DD:1};
  var flat=function(el){ return el.textContent.replace(/\s+/g,' ').trim(); };
  var leaf=function(el){ return !el.children.length || Array.prototype.every.call(el.children,function(ch){ return INLINE[ch.tagName]; }); };
  var walk=function(el){
    Array.prototype.forEach.call(el.children,function(ch){
      if(ch.classList.contains('dr')){ var kk=ch.querySelector('.dk'), vv=ch.querySelector('.dv');
        lines.push({t:(kk?flat(kk):'').toUpperCase()+':  '+(vv?flat(vv):'')}); return; }
      if(ch.tagName==='DIV'&&ch.parentNode&&ch.parentNode.classList.contains('qs-meta')){
        var dt=ch.querySelector('dt'), dd=ch.querySelector('dd');
        lines.push({t:(dt?flat(dt):'').toUpperCase()+':  '+(dd?flat(dd):'')}); return; }
      if(ch.classList.contains('qs-also')){ Array.prototype.forEach.call(ch.children,function(x){ var s=flat(x); if(s) lines.push({t:s}); }); return; }
      if(ch.tagName==='TABLE'){ Array.prototype.forEach.call(ch.querySelectorAll('tr'),function(tr){
        lines.push({t:Array.prototype.map.call(tr.children,function(td){ return flat(td); }).filter(Boolean).join('   |   ')}); }); lines.push({t:''}); return; }
      if(leaf(ch)||ch.tagName==='P'){ var s=flat(ch); if(s) lines.push({t:s}); return; }
      walk(ch);
    });
  };
  walk(tmp);
  return lines;
}
function docPdf(c){
  var k=docKind(c.name), title=pdfTxt(c.name), rows=docLines(k,c);
  var where=[c.acct?c.acct.n:'', c.pol?(c.pol.pno||c.pol.bkno||c.pol.id):'', c.line?c.line.id:''].filter(Boolean).join(' - ');
  var body=[]; rows.forEach(function(r){ pdfWrap(r.t,92).forEach(function(x){ body.push(x); }); });
  var PER=44, pages=[]; for(var i=0;i<body.length||!pages.length;i+=PER) pages.push(body.slice(i,i+PER));
  var objs=[], N=pages.length;
  objs.push('<</Type/Catalog/Pages 2 0 R>>');
  objs.push('<</Type/Pages/Kids['+pages.map(function(_,i){ return (3+i*2)+' 0 R'; }).join(' ')+']/Count '+N+'>>');
  pages.forEach(function(pg,i){
    var stream='BT /F2 15 Tf 56 792 Td ('+pdfEsc(title)+') Tj ET\n'+
      'BT /F1 9 Tf 56 776 Td ('+pdfEsc(where+(where?'   -   ':'')+'BimaKavach - prototype rendition')+') Tj ET\n'+
      '0.6 w 56 768 m 539 768 l S\n'+
      'BT /F1 10 Tf 56 750 Td 14 TL '+pg.map(function(x){ return '('+pdfEsc(x)+') Tj T*'; }).join(' ')+' ET\n'+
      'BT /F1 8 Tf 56 40 Td (Page '+(i+1)+' of '+N+') Tj ET';
    objs.push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 '+(3+N*2)+' 0 R/F2 '+(4+N*2)+' 0 R>>>>/Contents '+(4+i*2)+' 0 R>>');
    objs.push('<</Length '+stream.length+'>>\nstream\n'+stream+'\nendstream');
  });
  objs.push('<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>');
  objs.push('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
  var out='%PDF-1.4\n', off=[];
  objs.forEach(function(o,i){ off.push(out.length); out+=(i+1)+' 0 obj\n'+o+'\nendobj\n'; });
  var xref=out.length;
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  off.forEach(function(o){ out+=(('0000000000'+o).slice(-10))+' 00000 n \n'; });
  out+='trailer\n<</Size '+(objs.length+1)+'/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF';
  return out;
}
function docDownload(c){
  var k=docKind(c.name), fn=docFile(k,c).replace(/\.png$/,'.pdf'), data=docPdf(c);
  var bytes=new Uint8Array(data.length); for(var i=0;i<data.length;i++) bytes[i]=data.charCodeAt(i)&0xff;
  var blob=new Blob([bytes],{type:'application/pdf'});
  /* published pages hand the file over through the downloads capability; opened as a
     file, the plain anchor does it. Either way the viewer gets the same PDF. */
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(d){
      if(!d) return docAnchor(blob,fn);
      d.save({filename:fn,data:blob}).then(function(){ toast('Downloaded','The file is '+fn+'.'); },
        function(err){ if(err&&err.code==='declined') return; docAnchor(blob,fn); });
    },function(){ docAnchor(blob,fn); });
    return;
  }
  docAnchor(blob,fn);
}
function docAnchor(blob,fn){
  try{ var url=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=url; a.download=fn; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    toast('Downloaded','The file is '+fn+'.');
  }catch(e){ toast('Could not download',fn+' — the preview blocked the save. Open the page in its own tab.',{red:1}); }
}
HANDLERS.push(function(t){
  var x=t.closest('[data-docdl]');
  if(x){ var d={},ds=x.dataset,q; for(q in ds) d[q]=ds[q]; d.doc=ds.docdl; docDownload(docCtx(d)); return true; }
  x=t.closest('[data-doc]'); if(x){ docOpen(docCtx(x.dataset)); return true; }
  if(t.closest('[data-docclose]')){ docClose(); return true; }
  return false;
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&S.ui&&S.ui.docv){ docClose(); } });

/* ---------- the pair of buttons, for every list that shows a document ---------- */
function docAttr(name,c){ c=c||{};
  return 'data-doc="'+esc(name)+'"'+(c.acct?' data-dacct="'+esc(c.acct)+'"':'')+(c.pol?' data-dpol="'+esc(c.pol)+'"':'')+
    (c.line?' data-dline="'+esc(c.line)+'"':'')+(c.ref?' data-dref="'+esc(c.ref)+'"':'')+(c.v?' data-dv="'+esc(c.v)+'"':'');
}
function docBtns(name,c,sm){
  var s=sm===false?'':' sm', d=docAttr(name,c), dl=d.replace('data-doc=','data-docdl=');
  return '<button class="btn'+s+' ghost" '+d+'>'+ic('eye','ic14')+'View</button> <button class="btn'+s+' ghost" '+dl+'>'+ic('upload','ic14')+'Download</button>';
}
/* a narrow cell gets View alone — the document's own viewer carries Download */
function docView1(name,c,label){ return '<button class="btn sm ghost" '+docAttr(name,c)+'>'+ic('eye','ic14')+esc(label||'View')+'</button>'; }
/* one row of a document list: name, state, and the pair of buttons when it is held */
function docRow(name,held,who,c,extra){
  return '<div><div class="bd"><b>'+esc(name)+'</b>'+(held?'':' '+chip('Not on file','amber',true,true))+
    (extra?'<div class="m">'+extra+'</div>':'')+(!held&&who?'<div class="m">'+esc(who)+'</div>':'')+'</div>'+
    '<div class="rt">'+(held?docBtns(name,c):'<span class="meta">'+esc(who||'not on file yet')+'</span>')+'</div></div>';
}

  var fresh=!load(); if(fresh){ S.data=seed(); }
